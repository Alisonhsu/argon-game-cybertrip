<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>CyberTrip 4.0: The Akashic Ascension</title>
<style>
  :root {
    --cyan: #00f3ff;
    --pink: #ff007f;
    --green: #00ff66;
    --yellow: #ffe600;
    --purple: #8a2be2;
    --red: #ff0044;
  }
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #040109;
    color: #fff;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow: hidden;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
  }
  #gameWrapper { position: fixed; inset: 0; overflow: hidden; }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; }

  .spin-burst { animation: spinKick 0.4s cubic-bezier(0.17, 0.89, 0.32, 1.49); }
  @keyframes spinKick {
    0% { transform: scale(1.3) rotate(14deg); filter: brightness(2); }
    100% { transform: scale(1) rotate(0deg); filter: brightness(1); }
  }
  .flash-overlay {
    position: absolute; inset: 0; background: #fff; opacity: 0;
    pointer-events: none; transition: opacity 0.1s; z-index: 6;
  }

  /* ---------- 選單 ---------- */
  .overlay-screen {
    position: absolute; inset: 0;
    background: radial-gradient(circle at center, rgba(22, 8, 45, 0.95), rgba(4, 1, 10, 0.99));
    display: flex; justify-content: center; align-items: center;
    z-index: 30; padding: 10px; overflow-y: auto; touch-action: pan-y;
  }
  .panel {
    background: rgba(14, 7, 28, 0.96);
    border: 2px solid var(--cyan);
    box-shadow: 0 0 40px rgba(0, 243, 255, 0.25);
    border-radius: 16px;
    max-width: 780px; width: 100%;
    padding: 16px 18px;
    max-height: 96vh; overflow-y: auto;
  }
  .title-bar {
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid rgba(0, 243, 255, 0.3);
    padding-bottom: 8px; margin-bottom: 12px; flex-wrap: wrap; gap: 8px;
  }
  .main-title {
    font-size: 1.4rem; margin: 0;
    background: linear-gradient(90deg, var(--green), var(--cyan), var(--pink));
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .top-btn-group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .high-score-tag {
    font-size: 0.78rem; color: var(--yellow);
    background: rgba(255, 230, 0, 0.12); border: 1px solid var(--yellow);
    padding: 4px 10px; border-radius: 20px; font-weight: bold;
  }
  .btn-top {
    background: rgba(0, 243, 255, 0.15); border: 1px solid var(--cyan); color: var(--cyan);
    padding: 5px 11px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 0.78rem;
  }
  .btn-top:hover { background: var(--cyan); color: #000; }
  .btn-lang { background: linear-gradient(45deg, rgba(255,0,127,0.3), rgba(0,243,255,0.3)); border-color: var(--pink); color: #fff; }

  .grid-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 680px) { .grid-2col { grid-template-columns: 1fr; } }

  .step-box {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 10px; padding: 9px 11px; margin-bottom: 8px;
  }
  .step-title { font-size: 0.86rem; font-weight: bold; color: var(--cyan); margin-bottom: 7px; display: block; }
  .btn-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 6px; }
  .opt-btn {
    background: #150c28; border: 1px solid #3c256e; color: #ddd;
    padding: 8px 4px; border-radius: 8px; cursor: pointer;
    text-align: center; font-size: 0.84rem; font-weight: bold;
    transition: 0.15s; line-height: 1.3;
  }
  .opt-btn:hover { border-color: var(--cyan); }
  .opt-btn.active {
    background: linear-gradient(135deg, rgba(0, 243, 255, 0.28), rgba(255, 0, 127, 0.28));
    border: 2px solid var(--green); color: #fff;
    box-shadow: 0 0 10px rgba(0, 255, 102, 0.35);
  }
  /* 量化屬性標籤 */
  .chips { display: flex; flex-wrap: wrap; gap: 3px; justify-content: center; margin-top: 5px; }
  .chip { font-size: 0.66rem; padding: 1px 5px; border-radius: 6px; font-weight: bold; white-space: nowrap; }
  .chip.up { color: #00ff66; background: rgba(0, 255, 102, 0.12); }
  .chip.down { color: #ff5c85; background: rgba(255, 0, 68, 0.14); }
  .chip.neutral { color: #bbb; background: rgba(255, 255, 255, 0.08); }

  /* 音樂：主選項（分段切換）→ 曲風子面板 */
  .seg {
    display: grid; grid-template-columns: 1fr 1fr; gap: 3px;
    background: #0d0620; border: 1px solid #3c256e; border-radius: 12px; padding: 3px;
  }
  .seg-btn {
    padding: 9px 6px; border-radius: 9px; border: none; background: transparent;
    color: #aaa; font-weight: bold; font-size: 0.88rem; cursor: pointer; font-family: inherit;
  }
  .seg-btn.active {
    background: linear-gradient(135deg, rgba(0, 243, 255, 0.4), rgba(255, 0, 127, 0.4));
    color: #fff; box-shadow: 0 0 10px rgba(0, 243, 255, 0.35);
  }
  .sub-genre-panel {
    margin-top: 8px; padding: 8px;
    border-left: 3px solid var(--pink); background: rgba(0, 0, 0, 0.3);
    border-radius: 0 8px 8px 0;
  }
  .sub-genre-label { font-size: 0.76rem; color: #ff99cc; margin-bottom: 6px; display: block; font-weight: bold; }

  .launch-btn {
    width: 100%; padding: 12px; font-size: 1.1rem; font-weight: bold; color: #000;
    background: linear-gradient(90deg, var(--green), var(--cyan), var(--pink));
    border: none; border-radius: 50px; cursor: pointer; margin-top: 4px;
    box-shadow: 0 0 20px rgba(0, 255, 102, 0.5); font-family: inherit;
  }

  /* ---------- 遊戲內 HUD：單列、極簡 ---------- */
  #hud {
    position: absolute;
    top: calc(6px + env(safe-area-inset-top, 0px));
    left: 8px; right: 8px;
    display: none; justify-content: space-between; align-items: stretch;
    gap: 6px; z-index: 20; pointer-events: none;
  }
  .hud-pill {
    background: rgba(10, 4, 22, 0.72);
    border: 1px solid rgba(0, 243, 255, 0.35);
    border-radius: 10px; padding: 4px 9px;
    display: flex; flex-direction: column; justify-content: center; gap: 3px; min-width: 0;
  }
  .hud-left { flex: 0 1 150px; }
  .hud-center { flex: 1 1 auto; max-width: 280px; border-color: rgba(255, 230, 0, 0.6); text-align: center; }
  .hud-right { flex: 0 0 auto; align-items: flex-end; pointer-events: auto; }
  #tripStatus { font-size: 0.74rem; font-weight: bold; white-space: nowrap; color: var(--green); }
  .vibe-bar-bg { width: 100%; height: 7px; background: #1a1a2e; border-radius: 6px; overflow: hidden; border: 1px solid #444; }
  .vibe-bar-fill { height: 100%; width: 100%; background: linear-gradient(90deg, var(--pink), var(--cyan), var(--green)); transition: width 0.15s; }
  #stageTitle { font-size: 0.74rem; font-weight: bold; color: var(--yellow); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prog-bar-bg { width: 100%; height: 6px; background: #221538; border-radius: 4px; overflow: hidden; }
  #stageProgBar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--cyan), var(--yellow)); transition: width 0.2s; }
  .score-row { display: flex; align-items: baseline; gap: 6px; line-height: 1; }
  #comboVal { font-size: 0.7rem; font-weight: bold; color: var(--yellow); }
  #scoreVal { font-size: 0.95rem; font-weight: bold; color: var(--cyan); }
  .hud-btns { display: flex; gap: 4px; }
  .mini-ctrl-btn {
    background: rgba(255, 255, 255, 0.1); color: #fff;
    border: 1px solid rgba(0, 243, 255, 0.45); border-radius: 6px;
    padding: 2px 7px; cursor: pointer; font-size: 0.7rem; white-space: nowrap; font-family: inherit;
  }
  .mini-ctrl-btn:hover { background: var(--cyan); color: #000; }

  /* 底部：電台控制＋技能 */
  #bottomBar {
    position: absolute;
    bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    left: 50%; transform: translateX(-50%);
    z-index: 20; display: none; align-items: center; gap: 6px;
    background: rgba(8, 3, 18, 0.72); border: 1px solid rgba(0, 243, 255, 0.35);
    border-radius: 30px; padding: 4px 6px 4px 10px; white-space: nowrap;
  }
  #radioStationLabel { font-size: 0.68rem; color: var(--green); max-width: 150px; overflow: hidden; text-overflow: ellipsis; }
  .skill-btn {
    background: rgba(25, 12, 45, 0.85); color: #aaa; border: 1px solid #555;
    padding: 6px 14px; border-radius: 25px; font-size: 0.8rem; font-weight: bold; cursor: pointer; font-family: inherit;
  }
  .skill-btn.ready {
    background: linear-gradient(45deg, var(--pink), var(--purple)); color: #fff;
    border: 2px solid var(--yellow); box-shadow: 0 0 18px rgba(255, 0, 127, 0.85);
    animation: pulseBtn 0.7s infinite alternate;
  }
  @keyframes pulseBtn { from { transform: scale(1); } to { transform: scale(1.06); } }

  @media (max-width: 600px) {
    #hud { left: 6px; right: 6px; gap: 4px; }
    .hud-pill { padding: 3px 6px; }
    .hud-left { flex-basis: 92px; }
    #scoreVal { font-size: 0.85rem; }
    .mini-ctrl-btn { padding: 2px 5px; font-size: 0.66rem; }
    #radioStationLabel { display: none; }
  }

  /* ---------- 開局教學導覽 ---------- */
  #tutorial {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center;
    z-index: 25; background: rgba(4, 1, 10, 0.5); padding: 16px; touch-action: none;
  }
  #tutorial.show { display: flex; }
  .tut-card {
    background: rgba(14, 6, 30, 0.95); border: 2px solid var(--cyan); border-radius: 16px;
    padding: 16px 16px 14px; max-width: 360px; width: 100%; text-align: center;
    box-shadow: 0 0 30px rgba(0, 243, 255, 0.35); cursor: pointer;
  }
  .tut-title { font-size: 1.1rem; font-weight: bold; color: var(--cyan); margin-bottom: 10px; }
  .tut-row {
    display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 10px;
    margin-bottom: 8px; text-align: left; font-size: 0.85rem; line-height: 2;
  }
  .tut-row.good { background: rgba(0, 255, 102, 0.08); border: 1px solid rgba(0, 255, 102, 0.5); }
  .tut-row.bad { background: rgba(255, 0, 68, 0.1); border: 1px solid rgba(255, 0, 68, 0.6); }
  .tut-row.graze { background: rgba(255, 230, 0, 0.08); border: 1px solid rgba(255, 230, 0, 0.45); }
  .tut-tag { flex: 0 0 auto; font-weight: bold; font-size: 0.95rem; padding: 2px 10px; border-radius: 8px; line-height: 1.6; }
  .good .tut-tag { background: var(--green); color: #000; }
  .bad .tut-tag { background: var(--red); color: #fff; }
  .ico {
    display: inline-flex; width: 28px; height: 28px; border-radius: 50%;
    align-items: center; justify-content: center; margin-right: 3px; vertical-align: middle; font-size: 0.95rem;
  }
  .ico.good { border: 2px solid var(--green); }
  .ico.gold { border: 2px solid var(--yellow); }
  .ico.bad { border: 2px dashed var(--red); box-shadow: 0 0 8px rgba(255, 0, 68, 0.7); }
  .tut-ctrl { font-size: 0.8rem; color: #ccc; margin: 4px 0 10px; }
  .tut-start {
    font-weight: bold; color: #000; border-radius: 30px; padding: 9px;
    background: linear-gradient(90deg, var(--green), var(--cyan));
  }

  .modal-box {
    background: #120924; border: 2px solid var(--cyan); border-radius: 16px;
    max-width: 620px; width: 100%; padding: 20px; line-height: 1.6;
    max-height: 92vh; overflow-y: auto;
  }
  .guide-section {
    background: rgba(255,255,255,0.04); padding: 10px 14px; border-radius: 10px;
    margin-bottom: 10px; border-left: 4px solid var(--pink); font-size: 0.88rem;
  }
</style>
</head>
<body>

<div id="gameWrapper">
  <canvas id="gameCanvas"></canvas>
  <div class="flash-overlay" id="flashOverlay"></div>
  <audio id="globalRadioPlayer" preload="none" style="display:none;"></audio>

  <!-- 遊戲內 HUD -->
  <div id="hud">
    <div class="hud-pill hud-left">
      <div id="tripStatus">🌈 HAPPY</div>
      <div class="vibe-bar-bg"><div class="vibe-bar-fill" id="vibeBar"></div></div>
    </div>
    <div class="hud-pill hud-center">
      <div id="stageTitle">S1</div>
      <div class="prog-bar-bg"><div id="stageProgBar"></div></div>
    </div>
    <div class="hud-pill hud-right">
      <div class="score-row"><span id="comboVal">x1</span><span id="scoreVal">0</span></div>
      <div class="hud-btns">
        <button class="mini-ctrl-btn" onclick="togglePause()" id="pauseBtn">⏸ 暫停</button>
        <button class="mini-ctrl-btn" onclick="quitToMenu()" id="labBackBtn" style="border-color:var(--pink);">🧪</button>
      </div>
    </div>
  </div>

  <!-- 底部：電台＋技能 -->
  <div id="bottomBar">
    <span id="radioStationLabel">📻</span>
    <button class="mini-ctrl-btn" onclick="switchRadioChannel()" id="btnNextStation">⏭️</button>
    <button class="mini-ctrl-btn" onclick="toggleMuteAudio()" id="btnMuteAudio">🔊</button>
    <button class="skill-btn" id="skillBtn" onclick="triggerSkill()">⚡</button>
  </div>

  <!-- 開局教學導覽 -->
  <div id="tutorial">
    <div class="tut-card">
      <div class="tut-title" id="tutTitle"></div>
      <div class="tut-row good"><span class="tut-tag" id="tutEatLbl"></span><span id="tutEat"></span></div>
      <div class="tut-row bad"><span class="tut-tag" id="tutDodgeLbl"></span><span id="tutDodge"></span></div>
      <div class="tut-row graze"><span id="tutGraze"></span></div>
      <div class="tut-ctrl" id="tutControl"></div>
      <div class="tut-start" id="tutStart"></div>
    </div>
  </div>

  <!-- 主選單 -->
  <div class="overlay-screen" id="mainMenu">
    <div class="panel">
      <div class="title-bar">
        <h1 class="main-title" id="uiMainTitle">🧬 CyberTrip 4.0</h1>
        <div class="top-btn-group">
          <span class="high-score-tag" id="highScoreBadge">🏆 0</span>
          <button class="btn-top btn-lang" onclick="toggleLanguage()" id="langSwitchBtn">🌐 EN / 繁中</button>
          <button class="btn-top" onclick="toggleGuide(true)" id="guideOpenBtn">📖</button>
        </div>
      </div>

      <div class="grid-2col">
        <div>
          <div class="step-box">
            <span class="step-title" id="lblStep1"></span>
            <div class="btn-row">
              <div class="opt-btn active" onclick="setCfg('strain','sativa',this)" id="btnSativa"></div>
              <div class="opt-btn" onclick="setCfg('strain','indica',this)" id="btnIndica"></div>
              <div class="opt-btn" onclick="setCfg('strain','hybrid',this)" id="btnHybrid"></div>
            </div>
          </div>

          <div class="step-box">
            <span class="step-title" id="lblStep2"></span>
            <div class="seg">
              <button class="seg-btn active" onclick="setAudioMode('radio',this)" id="btnModeRadio"></button>
              <button class="seg-btn" onclick="setAudioMode('synth',this)" id="btnModeSynth"></button>
            </div>
            <div class="sub-genre-panel">
              <span class="sub-genre-label" id="lblSubGenre"></span>
              <div class="btn-row">
                <div class="opt-btn active" onclick="setGenre('psytrance',this)">🛸 Psytrance</div>
                <div class="opt-btn" onclick="setGenre('cyberpunk',this)">🦾 Cyberpunk</div>
                <div class="opt-btn" onclick="setGenre('indie',this)">🌸 Psych Indie</div>
                <div class="opt-btn" onclick="setGenre('techno',this)">⚙️ Techno</div>
              </div>
            </div>
          </div>

          <div class="step-box">
            <span class="step-title" id="lblStep3"></span>
            <div class="btn-row">
              <div class="opt-btn" onclick="setCfg('diff','easy',this)" id="btnEasy"></div>
              <div class="opt-btn active" onclick="setCfg('diff','normal',this)" id="btnNormal"></div>
              <div class="opt-btn" onclick="setCfg('diff','hard',this)" id="btnHard"></div>
            </div>
          </div>
        </div>

        <div>
          <div class="step-box">
            <span class="step-title" id="lblStep4"></span>
            <div class="btn-row">
              <div class="opt-btn active" onclick="setCfg('avatar','dog',this)" id="btnDog"></div>
              <div class="opt-btn" onclick="setCfg('avatar','cat',this)" id="btnCat"></div>
              <div class="opt-btn" onclick="setCfg('avatar','human',this)" id="btnHuman"></div>
              <div class="opt-btn" onclick="setCfg('avatar','alien',this)" id="btnAlien"></div>
            </div>
          </div>

          <div class="step-box">
            <span class="step-title"><span id="lblStep5"></span><span id="thcValText" style="color:var(--pink);">65%</span></span>
            <input type="range" min="15" max="99" value="65" style="width:100%; accent-color:var(--pink);" oninput="updateThcSlider(this.value)">
            <div id="thcHint" style="font-size:0.74rem; color:var(--green); margin-top:2px;"></div>
          </div>

          <div class="step-box">
            <span class="step-title" id="lblStep6"></span>
            <div class="btn-row">
              <div class="opt-btn" onclick="setCfg('cure','fresh',this)" id="btnFresh"></div>
              <div class="opt-btn active" onclick="setCfg('cure','aged',this)" id="btnAged"></div>
              <div class="opt-btn" onclick="setCfg('cure','quantum',this)" id="btnQuantum"></div>
            </div>
          </div>
        </div>
      </div>

      <button class="launch-btn" onclick="startGame()" id="btnLaunch"></button>
    </div>
  </div>

  <!-- 玩法說明 -->
  <div class="overlay-screen" id="guideModal" style="display:none; z-index:40;">
    <div class="modal-box">
      <h2 style="margin-top:0; color:var(--cyan);" id="guideTitle"></h2>
      <div class="guide-section" id="guideSec1"></div>
      <div class="guide-section" style="border-left-color:var(--green);" id="guideSec2"></div>
      <div class="guide-section" style="border-left-color:var(--yellow);" id="guideSec3"></div>
      <button class="launch-btn" onclick="toggleGuide(false)" id="guideCloseBtn"></button>
    </div>
  </div>

  <!-- 結算 -->
  <div class="overlay-screen" id="resultModal" style="display:none; z-index:45;">
    <div class="modal-box" style="text-align:center;">
      <h1 id="resTitle" style="font-size:1.8rem; margin-bottom:6px;"></h1>
      <p id="resDesc" style="color:#ccc; margin-bottom:14px; font-size:0.9rem;"></p>
      <div style="background:#190d30; padding:14px; border-radius:12px; border:1px solid var(--cyan); margin-bottom:14px;">
        <div style="font-size:2.3rem; font-weight:bold; color:var(--yellow);" id="resRank">RANK</div>
        <div style="font-size:1.3rem; color:var(--cyan); margin:6px 0;"><span id="lblFinalScore"></span><span id="resScore">0</span></div>
        <div style="font-size:0.85rem; color:#ddd;" id="resDetail"></div>
        <div style="margin-top:8px; padding:6px; background:#0d061a; border-radius:8px; font-family:monospace; color:var(--green); font-size:0.8rem;" id="resSeed"></div>
      </div>
      <button class="launch-btn" onclick="quitToMenu()" id="btnRetry"></button>
    </div>
  </div>
</div>

<script>
// ==================== 0. 工具 ====================
const FRAME_MS = 1000 / 60;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const $ = id => document.getElementById(id);
// 修正首頁空白：元素不存在時略過，不會讓整段翻譯中斷
const setT = (id, txt) => { const el = $(id); if (el) el.innerText = txt; };
const setH = (id, html) => { const el = $(id); if (el) el.innerHTML = html; };
const safeStorage = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
const chips = list => `<div class="chips">${list.map(([c, txt]) => `<span class="chip ${c}">${txt}</span>`).join('')}</div>`;

// ==================== 1. 雙語字典 ====================
let curLang = 'zh';

const I18N = {
  zh: {
    mainTitle: "🧬 CyberTrip 4.0",
    bestRecord: "🏆 最高 ",
    guideBtn: "📖 玩法",
    step1: "1. 品種",
    sativa: "🌿 Sativa", indica: "🍂 Indica", hybrid: "⚡ Hybrid",
    strainStats: {
      sativa: [['up', '反應+15%'], ['down', '落速+20%']],
      indica: [['up', '落速-20%'], ['down', '反應-35%']],
      hybrid: [['neutral', '均衡']]
    },
    step2: "2. 音樂",
    modeRadio: "📻 線上電台",
    modeSynth: "🎹 內建合成器",
    subGenreRadio: "↳ 電台曲風",
    subGenreSynth: "↳ 合成器曲風",
    step3: "3. 難度",
    easy: "🌱 簡單", normal: "🚀 普通", hard: "💀 地獄",
    step4: "4. 角色",
    dog: "🐶 邊牧", cat: "🐱 折耳貓", human: "🧑‍🚀 潛行者", alien: "👽 外星人",
    avatarStats: {

// ==================== 3. 音訊（非同步、逾時自動換台、最後退回合成器） ====================
let audioCtx = null, masterGain = null, delayNode = null;
let synthInterval = null, beatInterval = null;
let arpStep = 0, beatPulse = 0;
let audioSession = 0, radioAttempt = 0;
let radioPending = false, radioFailCount = 0, radioWatchdog = null, usingSynthFallback = false;
const radioEl = $('globalRadioPlayer');

function setRadioLabel(txt) { setT('radioStationLabel', txt); }
function currentStation() { const s = GLOBAL_RADIOS[cfg.genre]; return s[currentStationIdx % s.length]; }
function clearRadioWatchdog() { if (radioWatchdog) { clearTimeout(radioWatchdog); radioWatchdog = null; } }
function armRadioWatchdog(ms) {
  clearRadioWatchdog();
  const session = audioSession, attempt = radioAttempt;
  radioWatchdog = setTimeout(() => handleRadioFailure(session, 'timeout', attempt), ms);
}

radioEl.addEventListener('playing', () => {
  if (!gs.active || cfg.audioMode !== 'radio' || usingSynthFallback) return;
  clearRadioWatchdog();
  radioPending = false; radioFailCount = 0;
  setRadioLabel(`📻 ${currentStation().name}`);
});
radioEl.addEventListener('waiting', () => {
  if (gs.active && !gs.paused && !radioPending && cfg.audioMode === 'radio' && !usingSynthFallback && radioEl.getAttribute('src')) armRadioWatchdog(10000);
});
radioEl.addEventListener('error', () => {
  if (!radioEl.getAttribute('src')) return;
  handleRadioFailure(audioSession, 'error', radioAttempt);
});

function initAudioSystem() {
  stopAllAudio();
  const session = audioSession;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    audioCtx = AC ? new AC() : null;
  } catch (e) { audioCtx = null; }
  if (audioCtx) {
    masterGain = audioCtx.createGain();
    masterGain.gain.value = isAudioMuted ? 0 : 0.65;
    delayNode = audioCtx.createDelay();
    delayNode.delayTime.value = 0.24;
    const fb = audioCtx.createGain();
    fb.gain.value = 0.32;
    delayNode.connect(fb); fb.connect(delayNode);
    delayNode.connect(masterGain);
    masterGain.connect(audioCtx.destination);
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
  }
  radioFailCount = 0; usingSynthFallback = false;
  if (cfg.audioMode === 'radio') { startVisualBeatClock(); playGlobalRadioStream(session); }
  else startSynth(session);
}

function playGlobalRadioStream(session) {
  if (session !== audioSession) return;
  usingSynthFallback = false;
  const st = currentStation();
  const attempt = ++radioAttempt;
  setRadioLabel(`📻 ⏳ ${st.name}`);
  radioPending = true;
  radioEl.muted = isAudioMuted;
  try { radioEl.volume = 0.85; } catch (e) {}
  radioEl.src = st.url;
  armRadioWatchdog(6000);
  let p;
  try { p = radioEl.play(); } catch (e) { handleRadioFailure(session, 'play-throw', attempt); return; }
  if (p && typeof p.catch === 'function') {
    p.catch(err => {
      if (err && err.name === 'AbortError') return;
      handleRadioFailure(session, err ? err.name : 'play-rejected', attempt);
    });
  }
}

function handleRadioFailure(session, reason, attempt) {
  if (session !== audioSession || attempt !== radioAttempt) return;
  if (!gs.active || cfg.audioMode !== 'radio' || usingSynthFallback || gs.paused) return;
  radioAttempt++;
  clearRadioWatchdog();
  console.warn('[CyberTrip] radio failed:', currentStation().name, reason);
  const stations = GLOBAL_RADIOS[cfg.genre];
  radioFailCount++;
  if (radioFailCount < stations.length) {
    currentStationIdx = (currentStationIdx + 1) % stations.length;
    playGlobalRadioStream(session);
  } else {
    fallbackToSynth(session);
  }
}

function fallbackToSynth(session) {
  if (session !== audioSession) return;
  usingSynthFallback = true; radioPending = false;
  clearRadioWatchdog();
  releaseRadioElement();
  addFloatText(I18N[curLang].synthFallback, width / 2, layout.playerY - 140, "#00ff66", 15);
  startSynth(session);
}

function releaseRadioElement() {
  try { radioEl.pause(); } catch (e) {}
  if (radioEl.getAttribute('src')) {
    radioEl.removeAttribute('src');
    try { radioEl.load(); } catch (e) {}
  }
}

function startSynth(session) {
  if (session !== audioSession) return;
  if (beatInterval) { clearInterval(beatInterval); beatInterval = null; }
  setRadioLabel(`🎹 ${cfg.genre.toUpperCase()}`);
  startWebSynthLoop();
}

function switchRadioChannel() {
  if (!gs.active || gs.paused) return;
  if (cfg.audioMode === 'radio') {
    radioAttempt++;
    clearRadioWatchdog();
    if (synthInterval) { clearInterval(synthInterval); synthInterval = null; }
    if (!beatInterval) startVisualBeatClock();
    radioFailCount = 0;
    currentStationIdx = (currentStationIdx + 1) % GLOBAL_RADIOS[cfg.genre].length;
    playGlobalRadioStream(audioSession);
  } else {
    const genres = ['psytrance', 'cyberpunk', 'indie', 'techno'];
    cfg.genre = genres[(genres.indexOf(cfg.genre) + 1) % genres.length];
    startSynth(audioSession);
  }
}

function toggleMuteAudio() {
  isAudioMuted = !isAudioMuted;
  radioEl.muted = isAudioMuted;
  if (masterGain) masterGain.gain.value = isAudioMuted ? 0 : 0.65;
  setT('btnMuteAudio', isAudioMuted ? "🔇" : "🔊");
}

function genreBpm() {
  const base = cfg.genre === 'psytrance' ? 145 : (cfg.genre === 'cyberpunk' ? 118 : (cfg.genre === 'indie' ? 112 : 136));
  return base * STRAIN[cfg.strain].bpm;
}
function startVisualBeatClock() {
  if (beatInterval) clearInterval(beatInterval);
  beatInterval = setInterval(() => { if (gs.active && !gs.paused) beatPulse = 1.0; }, (60 / genreBpm()) * 1000);
}
function startWebSynthLoop() {
  if (synthInterval) clearInterval(synthInterval);
  const stepSec = (60 / genreBpm()) / 4;
  synthInterval = setInterval(() => {
    if (!gs.active || gs.paused || !audioCtx || !masterGain) return;
    const now = audioCtx.currentTime;
    const s = arpStep % 16;
    if (s % 4 === 0) { playKick(now, cfg.genre === 'cyberpunk' ? 115 : 155); beatPulse = 1.0; }
    if (cfg.genre === 'psytrance' && s % 4 !== 0) playBass(now, gs.badTrip ? 51.9 : 55, 0.08, 'sawtooth', 800);
    else if (cfg.genre === 'cyberpunk' && s % 2 === 0) playBass(now, s < 8 ? 43.65 : 51.91, 0.16, 'sawtooth', 950);
    else if (cfg.genre === 'techno' && (s === 2 || s === 6 || s === 10 || s === 14)) playBass(now, 65.4, 0.12, 'sawtooth', 1600);
    else if (cfg.genre === 'indie' && (s === 0 || s === 6 || s === 12)) playBass(now, 65.4, 0.28, 'triangle', 550);
    const scale = gs.badTrip ? [207.65, 220, 277.18, 311.13, 415.3] : [220, 261.63, 329.63, 392.00, 440, 523.25, 659.25];
    if (s % 2 === 0 || cfg.genre === 'psytrance') {
      const f = scale[(arpStep + (s % 3)) % scale.length] * (gs.stageIdx >= 3 ? 1.25 : 1);
      playStereoNote(now, f, 0.11, 'square', Math.sin(arpStep * 0.65) * 0.8);
    }
    arpStep++;
  }, stepSec * 1000);
}

function stopAllAudio() {
  audioSession++; radioAttempt++;
  clearRadioWatchdog();
  if (synthInterval) { clearInterval(synthInterval); synthInterval = null; }
  if (beatInterval) { clearInterval(beatInterval); beatInterval = null; }
  radioPending = false; usingSynthFallback = false;
  releaseRadioElement();
  if (audioCtx) { try { const p = audioCtx.close(); if (p && p.catch) p.catch(() => {}); } catch (e) {} }
  audioCtx = null; masterGain = null; delayNode = null;
}

function playKick(t, f) {
  if (!audioCtx || !masterGain) return;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(30, t + 0.13);
  g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
  o.connect(g); g.connect(masterGain); o.start(t); o.stop(t + 0.16);
}
function playBass(t, f, dur, type, cut) {
  if (!audioCtx || !masterGain) return;
  const o = audioCtx.createOscillator(), fl = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  fl.type = 'lowpass'; fl.frequency.setValueAtTime(cut, t); fl.frequency.exponentialRampToValueAtTime(110, t + dur);
  g.gain.setValueAtTime(0.22, t); g.gain.exponentialRampToValueAtTime(0.01, t + dur);
  o.connect(fl); fl.connect(g); g.connect(masterGain); o.start(t); o.stop(t + dur + 0.02);
}
function playStereoNote(t, f, dur, type, panVal) {
  if (!audioCtx || !masterGain) return;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(0.065, t); g.gain.exponentialRampToValueAtTime(0.004, t + dur);
  if (audioCtx.createStereoPanner) {
    const p = audioCtx.createStereoPanner(); p.pan.setValueAtTime(panVal, t);
    o.connect(p); p.connect(g);
  } else o.connect(g);
  g.connect(masterGain); if (delayNode) g.connect(delayNode);
  o.start(t); o.stop(t + dur + 0.02);
}
function playSFX(f1, f2, dur, type = 'sine') {
  if (!audioCtx || !masterGain || gs.paused || isAudioMuted) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(0.24, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(masterGain); o.start(t); o.stop(t + dur);
}

const canvas = $('gameCanvas');
const ctx = canvas.getContext('2d');
let width = window.innerWidth, height = window.innerHeight;
const layout = { bossY: 115, playerY: window.innerHeight - 100 };

const gs = {

// --- Sprite 快取（光圈＋emoji 只畫一次） ---
const spriteCache = {};
function getEmojiSprite(emoji, size, glow) {
  const key = `e|${emoji}|${size}|${glow}`;
  if (spriteCache[key]) return spriteCache[key];
  const pad = Math.ceil(size * 0.6), dim = Math.ceil(size * 1.3) + pad * 2;
  const c = document.createElement('canvas'); c.width = c.height = dim;
  const g = c.getContext('2d');
  g.font = `${size}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
  g.textAlign = 'center'; g.textBaseline = 'middle';
  if (glow) { g.shadowColor = glow; g.shadowBlur = size * 0.5; }
  g.fillText(emoji, dim / 2, dim / 2);
  spriteCache[key] = c;
  return c;
}
const ITEM_STYLE = {
  good:  { emoji: '✨', ring: '#00ff66', fill: 'rgba(0,255,102,0.14)' },
  cbd:   { emoji: '🌿', ring: '#00ff66', fill: 'rgba(0,255,102,0.14)' },
  star:  { emoji: '🌟', ring: '#ffe600', fill: 'rgba(255,230,0,0.16)' },
  bonus: { emoji: '✨', ring: '#ffe600', fill: 'rgba(255,230,0,0.2)' },
  bad:   { emoji: '👁️', ring: '#ff0044', fill: 'rgba(255,0,68,0.2)' }
};
// 掉落物自帶光圈：綠色實線＝吃、紅色尖刺＝躲
function getItemSprite(kind) {
  const key = `i|${kind}`;
  if (spriteCache[key]) return spriteCache[key];
  const st = ITEM_STYLE[kind];
  const size = kind === 'bonus' ? 38 : 30;
  const R = size * 0.82, dim = Math.ceil(R * 2 + 30), cx = dim / 2;
  const c = document.createElement('canvas'); c.width = c.height = dim;
  const g = c.getContext('2d');
  g.fillStyle = st.fill;
  g.beginPath(); g.arc(cx, cx, R, 0, Math.PI * 2); g.fill();
  if (kind === 'bad') {
    g.fillStyle = st.ring;
    for (let k = 0; k < 12; k++) {
      const a = (k / 12) * Math.PI * 2, a1 = a - 0.13, a2 = a + 0.13;
      g.beginPath();
      g.moveTo(cx + Math.cos(a1) * R, cx + Math.sin(a1) * R);
      g.lineTo(cx + Math.cos(a) * (R + 8), cx + Math.sin(a) * (R + 8));
      g.lineTo(cx + Math.cos(a2) * R, cx + Math.sin(a2) * R);
      g.closePath(); g.fill();
    }
    g.lineWidth = 2.5; g.strokeStyle = st.ring;
    g.beginPath(); g.arc(cx, cx, R, 0, Math.PI * 2); g.stroke();
  } else {
    g.shadowColor = st.ring; g.shadowBlur = 10;
    g.lineWidth = 2.5; g.strokeStyle = st.ring;
    g.beginPath(); g.arc(cx, cx, R, 0, Math.PI * 2); g.stroke();
    g.shadowBlur = 0;
  }
  g.font = `${size}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(st.emoji, cx, cx + 1);
  spriteCache[key] = c;
  return c;
}
function drawSprite(spr, x, y) { ctx.drawImage(spr, x - spr.width / 2, y - spr.height / 2); }

let badTripVignette = null;
function buildVignette() {
  const c = document.createElement('canvas');
  c.width = Math.max(1, width); c.height = Math.max(1, height);
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(width / 2, height / 2, Math.min(width, height) * 0.18, width / 2, height / 2, Math.max(width, height) * 0.75);
  grad.addColorStop(0, 'rgba(255,0,68,0)');
  grad.addColorStop(0.6, 'rgba(138,43,226,0.18)');
  grad.addColorStop(1, 'rgba(255,0,68,0.6)');
  g.fillStyle = grad; g.fillRect(0, 0, width, height);
  badTripVignette = c;
}

function computeLayout() {
  const hud = $('hud'), bar = $('bottomBar');
  let hudBottom = 0;
  if (hud.style.display === 'flex') hudBottom = hud.getBoundingClientRect().bottom;
  layout.bossY = Math.min(height * 0.4, Math.max(105, hudBottom + 62));
  let py = height - 100;
  if (bar.style.display === 'flex') py = Math.min(py, bar.getBoundingClientRect().top - 58);
  layout.playerY = Math.max(height * 0.55, py);
}

function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
  buildVignette();
  computeLayout();
  gs.playerX = clamp(gs.playerX, 40, Math.max(40, width - 40));
  gs.targetX = clamp(gs.targetX, 40, Math.max(40, width - 40));
  if (gs.active && gs.paused) { ctx.fillStyle = "#05010e"; ctx.fillRect(0, 0, width, height); drawPausedOverlay(); }
}

// --- 輸入 ---
function pointerToCanvasX(e) {
  const r = canvas.getBoundingClientRect();
  return (e.clientX - r.left) * (width / (r.width || width));
}
canvas.addEventListener('pointerdown', e => {
  if (!gs.active || gs.paused) return;
  const x = pointerToCanvasX(e);
  gs.targetX = x;
  gs.dashUntil = gs.now + 220;
  const r = canvas.getBoundingClientRect();
  gs.ripples.push({ x, y: Math.min(layout.playerY, e.clientY - r.top), r: 8, alpha: 0.9 });
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
});
canvas.addEventListener('pointermove', e => {
  if (!gs.active || gs.paused) return;
  gs.targetX = pointerToCanvasX(e);
});
canvas.addEventListener('contextmenu', e => e.preventDefault());
$('tutorial').addEventListener('pointerdown', e => { e.preventDefault(); dismissTutorial(); });

window.addEventListener('keydown', e => {
  if (e.code === 'Space' && gs.active) {
    e.preventDefault();
    if (gs.inTutorial) dismissTutorial();
    else if (!gs.paused) triggerSkill();
  }
  if (e.code === 'KeyP' && gs.active) togglePause();
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') { keys.left = true; if (gs.active) e.preventDefault(); }
  if (e.code === 'ArrowRight' || e.code === 'KeyD') { keys.right = true; if (gs.active) e.preventDefault(); }
});
window.addEventListener('keyup', e => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
});
window.addEventListener('blur', () => { keys.left = keys.right = false; });
document.addEventListener('visibilitychange', () => {
  if (document.hidden && gs.active && !gs.paused) togglePause();
});

// --- 教學導覽 ---
let tutTick = null, tutRemain = 5;
function showTutorial() {
  gs.inTutorial = true;
  tutRemain = safeStorage.get('cybertrip_tut', '0') === '1' ? 3 : 6;
  setT('tutStart', I18N[curLang].tutStart(tutRemain));
  $('tutorial').classList.add('show');
  clearInterval(tutTick);
  tutTick = setInterval(() => {
    if (gs.paused) return;
    tutRemain--;
    if (tutRemain <= 0) dismissTutorial();
    else setT('tutStart', I18N[curLang].tutStart(tutRemain));
  }, 1000);
}
function hideTutorial() {
  clearInterval(tutTick); tutTick = null;
  $('tutorial').classList.remove('show');
}
function dismissTutorial() {
  if (!gs.inTutorial) return;
  gs.inTutorial = false;
  hideTutorial();
  safeStorage.set('cybertrip_tut', '1');
  gs.invincibleUntil = gs.now + 1500;
  gs.lastGoodAt = gs.now; gs.lastProgressAt = gs.now; gs.lastStarAt = gs.now - 2000;
  gs.bossLaser.since = gs.now + 1500;
  announceStage(gs.stageIdx);
}

// --- 迴圈 ---
let rafId = null, lastFrameT = 0;
function startLoop() {
  if (rafId) cancelAnimationFrame(rafId);
  lastFrameT = performance.now();
  rafId = requestAnimationFrame(renderLoop);
}
function stopLoop() { if (rafId) cancelAnimationFrame(rafId); rafId = null; }
function renderLoop(t) {
  rafId = null;
  if (!gs.active || gs.paused) return;
  let dt = (t - lastFrameT) / FRAME_MS;
  lastFrameT = t;
  if (!(dt > 0)) dt = 1;
  dt = Math.min(dt, 3);
  try { stepAndDraw(dt); } catch (err) { console.error('[CyberTrip] frame error (loop continues):', err); }
  flushHUD();
  if (gs.active && !gs.paused) rafId = requestAnimationFrame(renderLoop);
}

function spawnParticles(x, y, color, count = 16) {
  if (gs.particles.length > 320) return;
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * Math.PI * 2, spd = 2 + Math.random() * 6;
    gs.particles.push({ x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, color, size: 3 + Math.random() * 3, alpha: 1.0 });
  }
}
function addFloatText(text, x, y, color = "#ffe600", size = 17) {
  if (gs.floatingTexts.length > 40) gs.floatingTexts.shift();
  gs.floatingTexts.push({ text, x, y, color, alpha: 1.0, vy: -2.0, size });
}
function flashScreen(color = "#fff") {
  const fl = $('flashOverlay');
  fl.style.background = color; fl.style.opacity = '0.65';
  setTimeout(() => { fl.style.opacity = '0'; }, 80);
}

function togglePause() {
  if (!gs.active) return;
  gs.paused = !gs.paused;
  const t = I18N[curLang];
  setT('pauseBtn', gs.paused ? t.resume : t.pause);
  if (gs.paused) {
    stopLoop();
    keys.left = keys.right = false;
    clearRadioWatchdog();
    if (cfg.audioMode === 'radio' && !usingSynthFallback) { try { radioEl.pause(); } catch (e) {} }
    if (audioCtx && audioCtx.suspend) audioCtx.suspend().catch(() => {});
    drawPausedOverlay();
  } else {
    if (audioCtx && audioCtx.resume) audioCtx.resume().catch(() => {});
    if (cfg.audioMode === 'radio' && !usingSynthFallback && radioEl.getAttribute('src')) {
      const session = audioSession, attempt = radioAttempt;
      radioPending = true;
      armRadioWatchdog(6000);
      const p = radioEl.play();
      if (p && p.catch) p.catch(err => { if (!err || err.name !== 'AbortError') handleRadioFailure(session, 'resume', attempt); });
    }
    gs.invincibleUntil = Math.max(gs.invincibleUntil, gs.now + 800);
    startLoop();
  }
}

function startGame() {
  $('mainMenu').style.display = 'none';
  $('resultModal').style.display = 'none';
  $('hud').style.display = 'flex';
  $('bottomBar').style.display = 'flex';

    stageIdx: 0, pendingStage: -1, pendingVictory: false,
    invincibleUntil: 0, hurtUntil: 0, dashUntil: 0, screenShake: 0,

    playerX: width / 2, targetX: width / 2
  });

  keys.left = keys.right = false;

function announceStage(idx) {
  const st = I18N[curLang].stages[idx];
  addFloatText(st.name, width / 2, height * 0.42, "#00f3ff", 22);
  addFloatText(st.hint, width / 2, height * 0.42 + 30, "#ffe600", 15);
}

function setupStage(idx) {
  const D = DIFF[cfg.diff];
  gs.stageIdx = idx;
  gs.stageProgress = 0;
  gs.pendingStage = -1;
  gs.invincibleUntil = gs.now + 2000;
  gs.items = [];
  gs.lastGoodAt = gs.now; gs.lastProgressAt = gs.now; gs.lastStarAt = gs.now - 2000;
  gs.bossLaser = { state: 'idle', xs: [], since: gs.now + 1500, hitApplied: false };

  const meta = STAGE_META[idx];
  gs.stageTarget = meta.goalType === 'boss' ? 100 : Math.max(4, Math.round(meta.baseTarget * D.targetMult));

  if (idx > 0) {
    flashScreen(meta.c1);
    canvas.classList.remove('spin-burst'); void canvas.offsetWidth; canvas.classList.add('spin-burst');
    playSFX(330, 920, 0.3, 'triangle');
  }
  if (!gs.inTutorial && idx > 0) announceStage(idx);
  renderHUD();
  computeLayout();
}

// 進度達標只「標記」換關，等本幀物件迴圈結束才切換（避免過關瞬間崩潰凍結）
function advanceStage(amount) {
  gs.stageProgress += amount;
  gs.lastProgressAt = gs.now;
  markHUD();
  if (gs.stageProgress >= gs.stageTarget && gs.pendingStage < 0 && !gs.pendingVictory) {
    if (gs.stageIdx + 1 >= DIFF[cfg.diff].stages) gs.pendingVictory = true;
    else gs.pendingStage = gs.stageIdx + 1;
  }
}

let lastSkillLabel = '';
function refreshSkillButton(force) {
  const btn = $('skillBtn');
  const t = I18N[curLang];
  const ready = gs.skillCharge >= 100;
  const label = ready ? t.skillReady : t.skillCharging(Math.floor(gs.skillCharge));
  if (force || label !== lastSkillLabel) {
    btn.innerText = label; lastSkillLabel = label;
    btn.classList.toggle('ready', ready);
  }
}
function chargeSkill(amt) {
  gs.skillCharge = Math.min(100, gs.skillCharge + amt * CURE[cfg.cure].charge * AVATAR[cfg.avatar].charge);
  refreshSkillButton(false);
}

function triggerSkill() {
  if (gs.skillCharge < 100 || !gs.active || gs.paused || gs.inTutorial) return;
  gs.skillCharge = 0;
  refreshSkillButton(true);
  flashScreen("#00f3ff"); gs.screenShake = 14;
  playSFX(440, 1320, 0.3, 'sawtooth');
  addFloatText(I18N[curLang].skills[cfg.avatar], gs.playerX, layout.playerY - 60, "#00ff66", 18);

  if (cfg.avatar === 'dog') {
    gs.items.forEach(it => { if (it.type === 'bad') { spawnParticles(it.x, it.y, "#ff0055", 12); gs.score += 300; } });
    gs.items = gs.items.filter(it => it.type !== 'bad');
  } else if (cfg.avatar === 'cat') {
    gs.items.forEach(it => { if (it.type !== 'bad') { it.x = it.baseX = gs.playerX; it.y = layout.playerY - 10; } });
  } else if (cfg.avatar === 'human') {
    gs.vibe = gs.maxVibe; gs.invincibleUntil = gs.now + 3000;
  } else if (cfg.avatar === 'alien') {
    gs.items.forEach(it => { if (it.type === 'bad') { it.type = 'good'; spawnParticles(it.x, it.y, "#ffe600", 10); } });
  }
  markHUD();
}

function takeDamage(amount, x, y) {
  if (gs.now < gs.invincibleUntil) { addFloatText("🛡️", x, y, "#00ffaa"); return false; }
  gs.vibe -= amount;
  gs.combo = 1;
  gs.invincibleUntil = gs.now + 650;
  gs.hurtUntil = gs.now + 650;
  gs.screenShake = 14;
  flashScreen("#ff0033");
  spawnParticles(x, y, "#ff0044", 22);
  playSFX(150, 42, 0.26, 'sawtooth');
  addFloatText(`💥 -${amount}`, x, y, "#ff0055");
  markHUD();
  return true;
}

// --- HUD：每幀最多更新一次、只寫有變的欄位 ---
let hudDirty = true;
const hudCache = {};
function markHUD() { hudDirty = true; }
function flushHUD() { if (hudDirty) renderHUD(); }
function hudText(id, txt) { if (hudCache[id] === txt) return; hudCache[id] = txt; setT(id, txt); }
function hudStyle(id, prop, val) {
  const k = `${id}.${prop}`;
  if (hudCache[k] === val) return;
  hudCache[k] = val;
  const el = $(id); if (el) el.style[prop] = val;
}
function renderHUD() {
  hudDirty = false;
  const t = I18N[curLang];
  const st = t.stages[gs.stageIdx];
  hudText('scoreVal', String(Math.floor(gs.score)));
  hudText('comboVal', `x${gs.combo}`);
  hudStyle('vibeBar', 'width', `${Math.round(clamp(gs.vibe / gs.maxVibe, 0, 1) * 100)}%`);
  hudText('stageTitle', st.hud(Math.min(gs.stageProgress, gs.stageTarget), gs.stageTarget));
  hudStyle('stageProgBar', 'width', `${Math.min(100, (gs.stageProgress / gs.stageTarget) * 100)}%`);
  hudText('tripStatus', gs.badTrip ? t.badTrip : t.happyTrip);
  hudStyle('tripStatus', 'color', gs.badTrip ? '#ff0055' : '#00ff66');
}

function endGame(victory) {
  if (!gs.active) return;
  gs.active = false; gs.paused = false; gs.inTutorial = false;
  hideTutorial();
  stopLoop();
  stopAllAudio();

  const finalScore = Math.floor(gs.score);
  const t = I18N[curLang];
  if (finalScore > savedHighScore) {
    savedHighScore = finalScore;
    safeStorage.set('cybertrip_best', String(savedHighScore));
    setT('highScoreBadge', `${t.bestRecord}${savedHighScore}`);
  }
  renderHUD();

  $('resultModal').style.display = 'flex';
  const title = $('resTitle');
  if (victory) {
    title.innerText = t.winTitle; title.style.color = "#00ff66";
    setT('resDesc', t.winDesc);
    setT('resRank', finalScore > 35000 ? "🏆 RANK: SSS" : (finalScore > 18000 ? "🌟 RANK: S" : "✨ RANK: A"));
  } else {
    title.innerText = t.loseTitle; title.style.color = "#ff0055";
    setT('resDesc', t.loseDesc);
    setT('resRank', "💀 RANK: F");
  }
  setT('resScore', String(finalScore));
  setT('resDetail', t.resDetail(gs.maxCombo, gs.grazeCount, t[cfg.diff]));
  setT('resSeed', `🧬 SEED: CT4-${cfg.strain.toUpperCase()}-${cfg.thc}-${cfg.avatar.toUpperCase()}-${cfg.diff.toUpperCase()}`);
}

function quitToMenu() {
  gs.active = false; gs.paused = false; gs.inTutorial = false;
  hideTutorial();
  stopLoop();
  stopAllAudio();
  $('hud').style.display = 'none';
  $('bottomBar').style.display = 'none';
  $('resultModal').style.display = 'none';
  $('mainMenu').style.display = 'flex';
  computeLayout();
}

// ==================== 5. 渲染與物理 ====================
function drawBackgroundAndBoss(now, meta, dt) {
  ctx.shadowBlur = 0;
  const fade = cfg.strain === 'indica' ? 0.24 : 0.38;
  ctx.fillStyle = `rgba(5, 1, 14, ${1 - Math.pow(1 - fade, dt)})`;
  ctx.fillRect(0, 0, width, height);

  const cx = width / 2, cy = height / 2;
  beatPulse *= Math.pow(0.88, dt);
  const pulseScale = 1 + beatPulse * 0.16;

  ctx.save();
  if (gs.screenShake > 0) {
    ctx.translate((Math.random() - 0.5) * gs.screenShake, (Math.random() - 0.5) * gs.screenShake);
    gs.screenShake *= Math.pow(0.85, dt);
    if (gs.screenShake < 0.5) gs.screenShake = 0;
  }
  if (cfg.strain === 'indica') {
    const s = 1 + 0.03 * Math.sin(now * 0.0018);
    ctx.translate(cx, cy); ctx.scale(s, s); ctx.translate(-cx, -cy);
  }

  if (meta.bgType === 'cyber_grid') {
    const grad = ctx.createLinearGradient(0, cy - 160, 0, cy + 20);
    grad.addColorStop(0, "#ff007f"); grad.addColorStop(1, "#ffe600");
    ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(cx, cy - 50, 85 * pulseScale, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = meta.c2; ctx.lineWidth = 1.5 + beatPulse * 2;
    for (let i = -10; i <= 10; i++) { ctx.beginPath(); ctx.moveTo(cx + i * 25, cy); ctx.lineTo(cx + i * 185, height); ctx.stroke(); }
    const off = (now * 0.16) % 40;
    for (let y = cy; y < height; y += 35) { ctx.beginPath(); ctx.moveTo(0, y + off); ctx.lineTo(width, y + off); ctx.stroke(); }
  } else if (meta.bgType === 'sine_wave') {
    for (let w = 0; w < 5; w++) {
      ctx.beginPath(); ctx.strokeStyle = w % 2 === 0 ? meta.c1 : meta.c2;
      ctx.lineWidth = 2.5 + beatPulse * 2.5;
      for (let x = 0; x <= width; x += 24) {
        const y = cy + Math.sin(x * 0.01 + now * 0.004 + w) * (60 + w * 22) * pulseScale;
        if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
  } else if (meta.bgType === 'hex_tunnel') {
    ctx.beginPath(); ctx.arc(cx, cy, 32 * pulseScale, 0, Math.PI * 2);
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2.5; ctx.stroke();
    for (let r = 1; r <= 6; r++) {
      const rad = ((now * 0.25 + r * 95) % 600) * (1 + beatPulse * 0.05);
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(now * 0.0012 * (r % 2 === 0 ? 1 : -1));
      ctx.strokeStyle = r % 2 === 0 ? meta.c1 : meta.c2; ctx.lineWidth = 2.2;
      ctx.beginPath();
      for (let s = 0; s <= 6; s++) {
        const a = s * Math.PI / 3;
        if (s === 0) ctx.moveTo(Math.cos(a) * rad, Math.sin(a) * rad); else ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
      }
      ctx.stroke(); ctx.restore();
    }
  } else if (meta.bgType === 'mandala') {
    ctx.save(); ctx.translate(cx, cy);
    for (let i = 0; i < 10; i++) {
      ctx.rotate((Math.PI * 2) / 10);
      ctx.strokeStyle = i % 2 === 0 ? meta.c1 : meta.c2; ctx.lineWidth = 2 + beatPulse * 2;
      const p = (130 + Math.sin(now * 0.005) * 50) * pulseScale;
      ctx.beginPath(); ctx.ellipse(p * 0.6, 0, p, 42, now * 0.002, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.restore();
  } else if (meta.bgType === 'boss_void') {
    const bossY = layout.bossY;
    const bossSpd = cfg.diff === 'hard' ? 0.0036 : 0.0022;
    gs.bossX = cx + Math.sin(now * bossSpd) * (width * 0.3);
    if (!gs.inTutorial) drawBossLaser(now, bossY);
    ctx.shadowColor = "#ff0033"; ctx.shadowBlur = 22;
    ctx.fillStyle = "#220011"; ctx.strokeStyle = "#ff0055"; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.ellipse(gs.bossX, bossY, 95 * pulseScale, 46 * pulseScale, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#ff0033"; ctx.beginPath(); ctx.arc(gs.bossX, bossY, 26, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#000"; ctx.beginPath(); ctx.arc(gs.bossX, bossY, 11, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
  ctx.shadowBlur = 0;
}

function drawBossLaser(now, bossY) {
  const L = DIFF[cfg.diff].laser;
  const bl = gs.bossLaser;
  const fireMs = 420;
  if (bl.state === 'idle') {
    if (now - bl.since > L.idle) {
      bl.state = 'warn'; bl.since = now;
      bl.xs = [gs.playerX];
      if (L.double) {   // 地獄：第二道雷射封住另一側
        let x2 = width - gs.playerX;
        if (Math.abs(x2 - gs.playerX) < 140) x2 = gs.playerX + (gs.playerX < width / 2 ? 170 : -170);
        bl.xs.push(clamp(x2, 40, width - 40));
      }
      playSFX(880, 440, 0.18, 'sine');
    }
  } else if (bl.state === 'warn') {
    const prog = clamp((now - bl.since) / L.warn, 0, 1);
    ctx.save();
    bl.xs.forEach(lx => {
      ctx.strokeStyle = `rgba(255, 0, 68, ${0.35 + Math.sin(now * 0.03) * 0.3})`;
      ctx.lineWidth = 5; ctx.setLineDash([12, 8]);
      ctx.beginPath(); ctx.moveTo(lx, bossY + 35); ctx.lineTo(lx, height); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = `rgba(255, 0, 68, ${0.12 + prog * 0.25})`;
      ctx.fillRect(lx - L.half * prog, bossY + 35, L.half * 2 * prog, height);
    });
    ctx.fillStyle = "#ff0044"; ctx.font = "bold 15px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(I18N[curLang].laserWarn, bl.xs[0], layout.playerY - 70);
    ctx.restore();
    if (now - bl.since > L.warn) {
      bl.state = 'fire'; bl.since = now; bl.hitApplied = false;
      gs.screenShake = 12;
      playSFX(180, 55, 0.3, 'sawtooth');
    }
  } else if (bl.state === 'fire') {
    ctx.save();
    ctx.fillStyle = "rgba(255, 0, 85, 0.85)"; ctx.shadowColor = "#ff0055"; ctx.shadowBlur = 22;
    bl.xs.forEach(lx => ctx.fillRect(lx - L.half, bossY + 35, L.half * 2, height));
    ctx.restore();
    if (!bl.hitApplied && now >= gs.invincibleUntil && bl.xs.some(lx => Math.abs(gs.playerX - lx) < L.half + 14)) {
      takeDamage(Math.round(L.dmg * CURE[cfg.cure].dmg), gs.playerX, layout.playerY - 40);
      bl.hitApplied = true;
    }
    if (now - bl.since > fireMs) { bl.state = 'idle'; bl.since = now; }
  }
}

function spawnItem(type, x, y, vyBase, extra = {}) {
  gs.items.push(Object.assign({
    x, baseX: x, y, vy: vyBase + Math.random() * 1.8,
    phase: Math.random() * Math.PI * 2,
    type, grazed: false, nearMiss: false, missed: false, guided: false, bonus: 0
  }, extra));
}

function stepAndDraw(dt) {
  gs.now += dt * FRAME_MS;
  const now = gs.now;
  const meta = STAGE_META[gs.stageIdx];
  const D = DIFF[cfg.diff], S = STRAIN[cfg.strain], A = AVATAR[cfg.avatar], C = CURE[cfg.cure];
  const playerY = layout.playerY;
  const live = !gs.inTutorial;
  ctx.globalAlpha = 1;

  drawBackgroundAndBoss(now, meta, dt);

  const kDir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  if (kDir) gs.targetX = clamp(gs.targetX + kDir * 15 * dt, 40, width - 40);

  // --- 生成 ---
  const fallSpeed = Math.min(14, 5.2 * D.fall * S.fall * (0.9 + cfg.thc / 200) * STAGE_SPEED[gs.stageIdx]);
  const margin = meta.bgType === 'sine_wave' ? 110 : 60;
  const randX = () => margin + Math.random() * Math.max(1, width - margin * 2);
  const nearPlayerX = spread => clamp(gs.playerX + (Math.random() * 2 - 1) * spread, margin, Math.max(margin, width - margin));
  const spawnY = meta.goalType === 'boss' ? layout.bossY + 25 : -35;

  if (live) {
    if (Math.random() < D.spawn * dt) {
      let type = 'good';
      const badP = clamp((D.bad[gs.stageIdx] + (cfg.thc - 50) * 0.002) * A.bad, 0.05, 0.6);
      if (meta.goalType === 'boss' && Math.random() < 0.3) type = 'star';
      else {
        const r = Math.random();
        if (r < badP) type = 'bad';
        else if (r > 1 - D.cbd) type = 'cbd';
      }
      spawnItem(type, randX(), spawnY, fallSpeed);
    }
    // 保底：簡單／普通才有，地獄沒有
    if (meta.goalType !== 'boss') {
      if (D.pityMs && now - gs.lastGoodAt > D.pityMs && !gs.items.some(it => it.type === 'good' && it.y < playerY - 120)) {
        spawnItem('good', nearPlayerX(130), spawnY, fallSpeed * 0.9, { guided: true });
        gs.lastGoodAt = now - D.pityMs + 1500;
      }
      if (D.pityMs && now - gs.lastProgressAt > STALL_MS && !gs.items.some(it => it.bonus)) {
        spawnItem('good', nearPlayerX(60), spawnY, fallSpeed * 0.8, { guided: true, bonus: 2 });
        addFloatText(I18N[curLang].supportOrb, width / 2, height * 0.35, "#ffe600");
        gs.lastProgressAt = now - STALL_MS / 2;
      }
    } else if (now - gs.lastStarAt > D.starPityMs && !gs.items.some(it => it.type === 'star')) {
      spawnItem('star', nearPlayerX(160), spawnY, fallSpeed * 0.85, { guided: true });
      gs.lastStarAt = now;
    }
    // 地獄：心境持續流失
    if (D.drain) { gs.vibe -= D.drain * dt * FRAME_MS / 1000; markHUD(); }
  }

  // --- 玩家 ---
  const sway = Math.sin(now * 0.005) * (cfg.thc * 0.18) * (gs.stageIdx === 0 ? 0.5 : 1);
  let desiredX = gs.targetX + sway;
  if (meta.bgType === 'hex_tunnel') desiredX += (width / 2 - gs.targetX) * 0.06;
  const follow = now < gs.dashUntil ? 0.38 : Math.min(0.35, S.follow * A.follow);
  gs.playerX += (desiredX - gs.playerX) * (1 - Math.pow(1 - follow, dt));
  gs.playerX = clamp(gs.playerX, 35, Math.max(35, width - 35));

  const cloneOffsets = meta.bgType === 'mandala' ? [-105, 0, 105] : [0];
  const catchers = cloneOffsets.map(o => gs.playerX + o);
  const catchR = D.catchR * A.catchR;
  const hitR = D.hitR * A.hit;
  const grazeR = hitR + 50;

  gs.trail.push({ x: gs.playerX, y: playerY });
  if (gs.trail.length > 12) gs.trail.shift();
  for (let i = 0; i < gs.trail.length; i++) {
    const tr = gs.trail[i], ratio = i / gs.trail.length;
    ctx.fillStyle = gs.badTrip ? `rgba(255, 0, 68, ${ratio * 0.4})` : `rgba(0, 243, 255, ${ratio * 0.4})`;
    ctx.beginPath(); ctx.arc(tr.x, tr.y + (12 - i) * 3.5, 20 * ratio, 0, Math.PI * 2); ctx.fill();
  }

  // --- 掉落物 ---
  const thcMult = 1 + (cfg.thc / 45);
  for (let i = gs.items.length - 1; i >= 0; i--) {
    const it = gs.items[i];
    if (!it) continue;
    it.y += it.vy * dt;

    if (it.type !== 'bad' && D.assist > 0) {
      const dy = playerY - it.y;
      if (dy > -20 && dy < 240) {
        let nearest = catchers[0], best = Infinity;
        for (const cxp of catchers) { const d = Math.abs(cxp - it.x); if (d < best) { best = d; nearest = cxp; } }
        if (best < 140) {
          const k = 1 - Math.pow(1 - Math.min(0.4, D.assist * (it.guided ? 1.8 : 1)), dt);
          const pull = (nearest - it.x) * k;
          if (meta.bgType === 'sine_wave') it.baseX += pull; else it.x += pull;
        }
      }
    }
    if (it.type === 'bad' && D.homing && it.y < playerY - 80) {   // 地獄：魔眼追蹤
      const dx = gs.playerX - it.x;
      const step = Math.sign(dx) * Math.min(Math.abs(dx), D.homing * dt);
      if (meta.bgType === 'sine_wave') it.baseX += step; else it.x += step;
    }
    if (meta.bgType === 'sine_wave') {
      const amp = 70 * (1 - 0.45 * clamp(it.y / playerY, 0, 1));
      it.x = it.baseX + Math.sin(it.y * 0.022 + it.phase) * amp;
    } else if (meta.bgType === 'hex_tunnel') {
      it.x += (width / 2 - it.x) * (1 - Math.pow(1 - 0.0025, dt));
    }

    drawSprite(getItemSprite(it.bonus ? 'bonus' : it.type), it.x, it.y);

    let caught = false;
    if (it.type !== 'bad') {
      for (const cxp of catchers) { if (Math.hypot(it.x - cxp, it.y - playerY) < catchR) { caught = true; break; } }
    }
    if (caught) { handleCatch(it, meta, thcMult); gs.items.splice(i, 1); continue; }

    if (it.type === 'bad') {
      const distMain = Math.hypot(it.x - gs.playerX, it.y - playerY);
      if (distMain < hitR) {
        takeDamage(Math.round(D.eyeDmg * C.dmg), it.x, it.y);
        gs.items.splice(i, 1);
        continue;
      }
      if (distMain < grazeR) it.nearMiss = true;
      if (it.nearMiss && !it.grazed && it.y > playerY + 36) {
        it.grazed = true; gs.grazeCount++;
        const gPts = Math.round(500 * gs.combo * (gs.badTrip ? 2.5 : 1) * D.scoreMult);
        gs.score += gPts; chargeSkill(28); spawnParticles(it.x, it.y, "#ffe600", 7);
        playSFX(950, 1480, 0.08, 'sine');
        addFloatText(`⚡ GRAZE +${gPts}`, it.x, playerY - 30, "#ffe600");
        markHUD();
      }
    } else if (it.type === 'good' && !it.missed && it.y > playerY + 45) {
      // 漏接懲罰：普通斷連擊，地獄再扣血
      it.missed = true;
      if (D.missCombo && gs.combo > 1) { gs.combo = 1; addFloatText(I18N[curLang].miss, it.x, playerY + 10, "#aaaaaa", 14); }
      if (D.missVibe) gs.vibe -= D.missVibe;
      markHUD();
    }
    if (it.y > height + 50) gs.items.splice(i, 1);
  }

  for (let i = gs.particles.length - 1; i >= 0; i--) {
    const p = gs.particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.alpha -= 0.035 * dt;
    if (p.alpha <= 0) { gs.particles.splice(i, 1); continue; }
    ctx.globalAlpha = p.alpha; ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  for (let i = gs.lasers.length - 1; i >= 0; i--) {
    const ls = gs.lasers[i];
    ctx.strokeStyle = `rgba(255, 230, 0, ${Math.max(0, ls.alpha)})`; ctx.lineWidth = 10;
    ctx.beginPath(); ctx.moveTo(ls.x1, ls.y1); ctx.lineTo(ls.x2, ls.y2); ctx.stroke();
    ls.alpha -= 0.06 * dt; if (ls.alpha <= 0) gs.lasers.splice(i, 1);
  }

  for (let i = gs.ripples.length - 1; i >= 0; i--) {
    const rp = gs.ripples[i];
    rp.r += 4 * dt; rp.alpha -= 0.06 * dt;
    if (rp.alpha <= 0) { gs.ripples.splice(i, 1); continue; }
    ctx.strokeStyle = `rgba(0, 243, 255, ${rp.alpha})`; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(rp.x, rp.y, rp.r, 0, Math.PI * 2); ctx.stroke();
  }

  const avatarSize = cfg.avatar === 'cat' ? 42 : 50;
  const avatarSpr = getEmojiSprite(AVATAR_ICONS[cfg.avatar], avatarSize, gs.badTrip ? '#ff0033' : '#00f3ff');
  cloneOffsets.forEach(off => {
    ctx.save();
    ctx.translate(gs.playerX + off, playerY);
    let a = off !== 0 ? 0.55 : 1;
    if (off === 0 && now < gs.hurtUntil) a *= (Math.floor(now / 80) % 2) ? 0.35 : 1;
    ctx.globalAlpha = a;
    ctx.rotate(clamp((gs.targetX - gs.playerX) * 0.0045, -0.45, 0.45));
    ctx.strokeStyle = now < gs.invincibleUntil ? "#ffe600" : (gs.badTrip ? "#ff0044" : "#00f3ff");
    ctx.lineWidth = 2.5 + beatPulse * 2.5;
    ctx.beginPath(); ctx.arc(0, 0, (cfg.avatar === 'cat' ? 30 : 36) + beatPulse * 5, 0, Math.PI * 2); ctx.stroke();
    drawSprite(avatarSpr, 0, 0);
    ctx.restore();
  });

  const wasBad = gs.badTrip;
  gs.badTrip = gs.vibe / gs.maxVibe < 0.35;
  if (wasBad !== gs.badTrip) markHUD();
  if (gs.badTrip && badTripVignette) {
    ctx.globalAlpha = 0.65 + beatPulse * 0.35;
    ctx.drawImage(badTripVignette, 0, 0);
    ctx.globalAlpha = 1;
  }

  ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
  for (let i = gs.floatingTexts.length - 1; i >= 0; i--) {
    const ft = gs.floatingTexts[i];
    ft.y += ft.vy * dt; ft.alpha -= 0.022 * dt;
    if (ft.alpha <= 0) { gs.floatingTexts.splice(i, 1); continue; }
    ctx.font = `bold ${ft.size}px sans-serif`;
    ctx.globalAlpha = ft.alpha; ctx.fillStyle = ft.color;
    ctx.fillText(ft.text, ft.x, ft.y);
  }
  ctx.globalAlpha = 1;

  if (gs.vibe <= 0) { gs.vibe = 0; endGame(false); return; }
  if (gs.pendingVictory) { endGame(true); return; }
  if (gs.pendingStage >= 0) setupStage(gs.pendingStage);
}

function handleCatch(it, meta, thcMult) {
  const D = DIFF[cfg.diff];
  const badBonus = gs.badTrip ? 2.5 : 1.0;
  if (it.type === 'good') {
    const pts = Math.round(100 * gs.combo * thcMult * D.scoreMult * badBonus * (it.bonus ? 2 : 1));
    gs.score += pts;
    gs.combo = Math.min(16, gs.combo + 1);
    gs.maxCombo = Math.max(gs.maxCombo, gs.combo);
    gs.vibe = Math.min(gs.maxVibe, gs.vibe + D.catchHeal);
    gs.lastGoodAt = gs.now;
    chargeSkill(14);
    spawnParticles(it.x, it.y, it.bonus ? "#ffe600" : "#00f3ff", 14);
    playSFX(440 + gs.combo * 32, 880 + gs.combo * 40, 0.1, 'sine');
    addFloatText(`+${pts}`, it.x, it.y, "#00f3ff");
    if (meta.goalType !== 'boss') advanceStage(it.bonus || 1);
  } else if (it.type === 'star') {
    gs.score += 1200 * gs.combo * D.scoreMult;
    gs.lastStarAt = gs.now;
    gs.lasers.push({ x1: gs.playerX, y1: layout.playerY, x2: gs.bossX, y2: layout.bossY, alpha: 1.0 });
    gs.screenShake = 10; chargeSkill(25); spawnParticles(gs.bossX, layout.bossY, "#ffe600", 24);
    playSFX(620, 1550, 0.25, 'sawtooth');
    addFloatText(`💥 -${D.starDmg}%`, gs.bossX, layout.bossY + 55, "#ffe600", 19);
    advanceStage(D.starDmg);
  } else if (it.type === 'cbd') {
    gs.vibe = Math.min(gs.maxVibe, gs.vibe + D.cbdHeal); gs.score += 600 * D.scoreMult; chargeSkill(20);
    flashScreen("#00ff66"); spawnParticles(it.x, it.y, "#00ff66", 18);
    playSFX(523, 1046, 0.2, 'triangle');
    addFloatText(`🌿 +${D.cbdHeal}`, it.x, it.y, "#00ff66");
  }
  markHUD();
}

function drawPausedOverlay() {
  ctx.save();
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(4, 1, 10, 0.55)';
  ctx.fillRect(0, 0, width, height);
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 22px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(I18N[curLang].pausedText, width / 2, height / 2);
  ctx.restore();
}

// ==================== 6. 初始化 ====================
window.addEventListener('resize', resize);
resize();
applyTranslations();
</script>
