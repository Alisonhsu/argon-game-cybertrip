<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CyberTrip 4.0: The Akashic Ascension</title>
<style>
  :root {
    --cyan: #00f3ff;
    --pink: #ff007f;
    --green: #00ff66;
    --yellow: #ffe600;
    --purple: #8a2be2;
    --red: #ff0044;
  }
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  body {
    margin: 0;
    background: #040109;
    color: #fff;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow: hidden;
    touch-action: none;
  }
  #gameWrapper {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
    transition: filter 0.25s;
  }

  /* 視覺特效層 */
  .wave-indica { animation: slowBreath 3.5s infinite ease-in-out; }
  .bad-trip-fx {
    filter: invert(0.88) hue-rotate(155deg) contrast(1.55) saturate(1.8) !important;
  }
  .spin-burst {
    animation: spinKick 0.38s cubic-bezier(0.17, 0.89, 0.32, 1.49);
  }
  @keyframes slowBreath {
    0%, 100% { transform: scale(1.02) skew(0deg, 0deg); }
    50% { transform: scale(1.06) skew(1deg, -1deg); }
  }
  @keyframes spinKick {
    0% { transform: scale(1.3) rotate(14deg); filter: brightness(2); }
    100% { transform: scale(1) rotate(0deg); filter: brightness(1); }
  }

  .flash-overlay {
    position: absolute;
    inset: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.1s;
    z-index: 6;
  }

  /* 開局 3 秒直覺視覺教學導覽卡 */
  #quickTutorial {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(10, 4, 24, 0.92);
    border: 2px solid var(--cyan);
    box-shadow: 0 0 35px rgba(0, 243, 255, 0.4);
    border-radius: 16px;
    padding: 16px 24px;
    z-index: 25;
    pointer-events: none;
    text-align: center;
    opacity: 0;
    transition: opacity 0.35s;
    min-width: 280px;
  }
  #quickTutorial.show { opacity: 1; }
  .tut-row {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin: 10px 0;
    font-size: 0.95rem;
    font-weight: bold;
  }
  .tut-box {
    padding: 8px 14px;
    border-radius: 10px;
    background: rgba(255,255,255,0.05);
  }

  /* 選單與彈窗系統 */
  .overlay-screen {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, rgba(22, 8, 45, 0.95), rgba(4, 1, 10, 0.99));
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 30;
    padding: 10px;
    overflow-y: auto;
  }
  .panel {
    background: rgba(14, 7, 28, 0.96);
    border: 2px solid var(--cyan);
    box-shadow: 0 0 40px rgba(0, 243, 255, 0.25);
    border-radius: 16px;
    max-width: 780px;
    width: 100%;
    padding: 16px 20px;
    max-height: 96vh;
    overflow-y: auto;
  }
  .title-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(0, 243, 255, 0.3);
    padding-bottom: 8px;
    margin-bottom: 12px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .main-title {
    font-size: 1.35rem;
    margin: 0;
    background: linear-gradient(90deg, var(--green), var(--cyan), var(--pink));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .top-btn-group {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .high-score-tag {
    font-size: 0.78rem;
    color: var(--yellow);
    background: rgba(255, 230, 0, 0.12);
    border: 1px solid var(--yellow);
    padding: 4px 10px;
    border-radius: 20px;
    font-weight: bold;
  }
  .btn-top {
    background: rgba(0, 243, 255, 0.15);
    border: 1px solid var(--cyan);
    color: var(--cyan);
    padding: 5px 11px;
    border-radius: 20px;
    cursor: pointer;
    font-weight: bold;
    font-size: 0.78rem;
  }
  .btn-top:hover { background: var(--cyan); color: #000; }
  .btn-lang {
    background: linear-gradient(45deg, rgba(255,0,127,0.3), rgba(0,243,255,0.3));
    border: 1px solid var(--pink);
    color: #fff;
  }

  .grid-2col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  @media (max-width: 680px) { .grid-2col { grid-template-columns: 1fr; } }

  .step-box {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    padding: 9px 11px;
    margin-bottom: 8px;
  }
  .step-title {
    font-size: 0.84rem;
    font-weight: bold;
    color: var(--cyan);
    margin-bottom: 6px;
    display: block;
  }
  .btn-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(85px, 1fr));
    gap: 6px;
  }
  .opt-btn {
    background: #150c28;
    border: 1px solid #3c256e;
    color: #ccc;
    padding: 7px 4px;
    border-radius: 8px;
    cursor: pointer;
    text-align: center;
    font-size: 0.8rem;
    transition: 0.15s;
    line-height: 1.35;
  }
  .opt-btn small {
    display: block;
    font-size: 0.7rem;
    color: var(--yellow);
    margin-top: 2px;
  }
  .opt-btn.active {
    background: linear-gradient(135deg, rgba(0, 243, 255, 0.28), rgba(255, 0, 127, 0.28));
    border: 2px solid var(--green);
    color: #fff;
    font-weight: bold;
    box-shadow: 0 0 10px rgba(0, 255, 102, 0.35);
  }

  /* 電台階層化子面板 */
  .sub-genre-panel {
    background: rgba(0, 0, 0, 0.35);
    border-left: 3px solid var(--pink);
    padding: 7px 8px;
    border-radius: 0 8px 8px 0;
    margin-top: 7px;
  }
  .sub-genre-label {
    font-size: 0.74rem;
    color: #ff99cc;
    margin-bottom: 5px;
    display: block;
    font-weight: bold;
  }

  .launch-btn {
    width: 100%;
    padding: 12px;
    font-size: 1.1rem;
    font-weight: bold;
    color: #000;
    background: linear-gradient(90deg, var(--green), var(--cyan), var(--pink));
    border: none;
    border-radius: 50px;
    cursor: pointer;
    margin-top: 4px;
    box-shadow: 0 0 20px rgba(0, 255, 102, 0.5);
  }

  /* 遊戲內極簡緊湊頂部 HUD (手機與電腦皆不佔版面！) */
  #hud {
    position: absolute;
    top: 6px;
    left: 8px;
    right: 8px;
    display: none;
    justify-content: space-between;
    align-items: center;
    z-index: 20;
    pointer-events: none;
    gap: 6px;
  }
  .hud-pill {
    background: rgba(10, 4, 22, 0.78);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(0, 243, 255, 0.35);
    padding: 5px 10px;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .vibe-bar-bg {
    width: 110px;
    height: 8px;
    background: #1a1a2e;
    border-radius: 6px;
    overflow: hidden;
    border: 1px solid #444;
  }
  .vibe-bar-fill {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, var(--pink), var(--cyan), var(--green));
    transition: width 0.15s;
  }

  /* 中央極簡進度膠囊 */
  .hud-center {
    flex: 1;
    max-width: 260px;
    background: rgba(18, 6, 38, 0.82);
    border: 1px solid var(--yellow);
    padding: 5px 10px;
    border-radius: 10px;
    text-align: center;
  }
  .prog-bar-bg {
    width: 100%;
    height: 7px;
    background: #221538;
    border-radius: 4px;
    overflow: hidden;
    margin-top: 3px;
  }
  #stageProgBar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--cyan), var(--yellow));
    transition: width 0.2s;
  }

  /* 右上極簡分數與控制群 */
  .hud-right {
    background: rgba(10, 4, 22, 0.78);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(0, 243, 255, 0.35);
    padding: 5px 10px;
    border-radius: 10px;
    text-align: right;
    pointer-events: auto;
  }
  .score-row {
    display: flex;
    align-items: baseline;
    justify-content: flex-end;
    gap: 8px;
  }
  .mini-btn-row {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 4px;
    margin-top: 3px;
  }
  .mini-ctrl-btn {
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
    border: 1px solid rgba(0, 243, 255, 0.45);
    border-radius: 5px;
    padding: 2px 6px;
    cursor: pointer;
    font-size: 0.7rem;
    white-space: nowrap;
  }
  .mini-ctrl-btn:hover { background: var(--cyan); color: #000; }

  @media (max-width: 600px) {
    .hud-pill, .hud-center, .hud-right { padding: 4px 7px; }
    .vibe-bar-bg { width: 80px; height: 6px; }
    .hud-center { max-width: 145px; }
    #radioStationLabel { display: none; }
  }

  /* 底部技能充能按鈕 */
  #bottomBar {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    display: none;
    pointer-events: auto;
  }
  .skill-btn {
    background: rgba(25, 12, 45, 0.85);
    color: #aaa;
    border: 1px solid var(--cyan);
    padding: 6px 18px;
    border-radius: 25px;
    font-size: 0.82rem;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 12px rgba(0, 243, 255, 0.25);
  }
  .skill-btn.ready {
    background: linear-gradient(45deg, var(--pink), var(--purple));
    color: #fff;
    border: 2px solid var(--yellow);
    box-shadow: 0 0 20px rgba(255, 0, 127, 0.85);
    animation: pulseBtn 0.7s infinite alternate;
  }
  @keyframes pulseBtn {
    from { transform: scale(1); }
    to { transform: scale(1.06); }
  }

  .modal-box {
    background: #120924;
    border: 2px solid var(--cyan);
    border-radius: 16px;
    max-width: 620px;
    width: 100%;
    padding: 20px;
    line-height: 1.5;
    max-height: 92vh;
    overflow-y: auto;
  }
  .guide-section {
    background: rgba(255,255,255,0.04);
    padding: 10px 14px;
    border-radius: 10px;
    margin-bottom: 10px;
    border-left: 4px solid var(--pink);
    font-size: 0.86rem;
  }
</style>
</head>
<body>

<div id="gameWrapper">
  <canvas id="gameCanvas"></canvas>
  <div class="flash-overlay" id="flashOverlay"></div>

  <!-- 開局 3 秒直覺教學導覽卡 -->
  <div id="quickTutorial">
    <div style="color:var(--cyan); font-weight:bold; font-size:1.05rem;" id="tutTitle">🎮 直覺操作導覽</div>
    <div class="tut-row">
      <div class="tut-box" style="border:1px solid var(--green); color:var(--green);" id="tutEat">
        🟢 收集：✨光球 🌿回血 🌟星星
      </div>
      <div class="tut-box" style="border:1px solid var(--red); color:var(--red);" id="tutDodge">
        🔴 閃避：👁️紅圈魔眼
      </div>
    </div>
    <div style="font-size:0.8rem; color:#ccc;" id="tutControl">🖱️ 滑鼠或手指直接點擊/滑動畫面即可移動</div>
  </div>

  <!-- 隱藏的全球網路電台播放器 -->
  <audio id="globalRadioPlayer" preload="none" style="display:none;"></audio>

  <!-- 遊戲內極簡頂部 HUD -->
  <div id="hud">
    <div class="hud-pill">
      <div id="tripStatus" style="font-weight:bold; font-size:0.78rem; color:var(--green);">🌈 HAPPY</div>
      <div class="vibe-bar-bg"><div class="vibe-bar-fill" id="vibeBar"></div></div>
    </div>

    <div class="hud-center">
      <div class="stage-badge" id="stageTitle">S1 / 5</div>
      <div class="prog-bar-bg"><div id="stageProgBar"></div></div>
    </div>

    <div class="hud-right">
      <div class="score-row">
        <span style="font-size:0.78rem; font-weight:bold; color:var(--yellow);" id="comboVal">x1</span>
        <span style="font-size:1rem; font-weight:bold; color:var(--cyan);" id="scoreVal">0</span>
      </div>
      <div class="mini-btn-row">
        <span id="radioStationLabel" style="font-size:0.68rem; color:var(--green); margin-right:2px;">📻 FM</span>
        <button class="mini-ctrl-btn" onclick="switchRadioChannel()" title="Next Station">⏭️</button>
        <button class="mini-ctrl-btn" onclick="toggleMuteAudio()" id="btnMuteAudio">🔊</button>
        <button class="mini-ctrl-btn" onclick="togglePause()" id="pauseBtn">⏸️ 暫停</button>
        <button class="mini-ctrl-btn" onclick="quitToMenu()" id="labBackBtn" style="border-color:var(--pink);">🧪</button>
      </div>
    </div>
  </div>

  <!-- 底部技能充能按鈕 -->
  <div id="bottomBar">
    <button class="skill-btn" id="skillBtn" onclick="triggerSkill()">⚡ MP 0%</button>
  </div>

  <!-- 1. 主選單：賽博煉金室 (精簡文字 + 量化屬性) -->
  <div class="overlay-screen" id="mainMenu">
    <div class="panel">
      <div class="title-bar">
        <h1 class="main-title" id="uiMainTitle">🧬 CyberTrip 4.0</h1>
        <div class="top-btn-group">
          <span class="high-score-tag" id="highScoreBadge">🏆 0</span>
          <button class="btn-top btn-lang" onclick="toggleLanguage()" id="langSwitchBtn">🌐 EN / 繁中</button>
          <button class="btn-top" onclick="toggleGuide(true)" id="guideOpenBtn">📖 指南</button>
        </div>
      </div>

      <div class="grid-2col">
        <div>
          <div class="step-box">
            <span class="step-title" id="lblStep1">1. 麻草基因</span>
            <div class="btn-row">
              <div class="opt-btn active" onclick="setCfg('strain','sativa',this)" id="btnSativa"></div>
              <div class="opt-btn" onclick="setCfg('strain','indica',this)" id="btnIndica"></div>
              <div class="opt-btn" onclick="setCfg('strain','hybrid',this)" id="btnHybrid"></div>
            </div>
          </div>

          <div class="step-box">
            <span class="step-title" id="lblStep2">2. 音樂類型 (先選音源 ➔ 再選曲風)</span>
            <div class="btn-row">
              <div class="opt-btn active" onclick="setAudioMode('radio',this)" id="btnModeRadio"></div>
              <div class="opt-btn" onclick="setAudioMode('synth',this)" id="btnModeSynth"></div>
            </div>
            <div class="sub-genre-panel">
              <span class="sub-genre-label" id="lblSubGenre">↳ 選擇曲風頻道：</span>
              <div class="btn-row">
                <div class="opt-btn active" onclick="setGenre('psytrance',this)">🛸 <b>Psytrance</b></div>
                <div class="opt-btn" onclick="setGenre('cyberpunk',this)">🦾 <b>Cyberpunk</b></div>
                <div class="opt-btn" onclick="setGenre('indie',this)">🌸 <b>Psych Indie</b></div>
                <div class="opt-btn" onclick="setGenre('techno',this)">⚙️ <b>Acid Techno</b></div>
              </div>
            </div>
          </div>

          <div class="step-box">
            <span class="step-title" id="lblStep3">3. 遊戲難度</span>
            <div class="btn-row">
              <div class="opt-btn" onclick="setCfg('diff','easy',this)" id="btnEasy"></div>
              <div class="opt-btn active" onclick="setCfg('diff','normal',this)" id="btnNormal"></div>
              <div class="opt-btn" onclick="setCfg('diff','hard',this)" id="btnHard"></div>
            </div>
          </div>
        </div>

        <div>
          <div class="step-box">
            <span class="step-title" id="lblStep4">4. 選擇角色</span>
            <div class="btn-row">
              <div class="opt-btn active" onclick="setCfg('avatar','dog',this)" id="btnDog"></div>
              <div class="opt-btn" onclick="setCfg('avatar','cat',this)" id="btnCat"></div>
              <div class="opt-btn" onclick="setCfg('avatar','human',this)" id="btnHuman"></div>
              <div class="opt-btn" onclick="setCfg('avatar','alien',this)" id="btnAlien"></div>
            </div>
          </div>

          <div class="step-box">
            <span class="step-title"><span id="lblStep5">5. THC 濃度：</span><span id="thcValText" style="color:var(--pink);">65%</span></span>
            <input type="range" min="15" max="99" value="65" style="width:100%; accent-color:var(--pink);" oninput="updateThcSlider(this.value)">
            <div id="thcHint" style="font-size:0.74rem; color:var(--green); margin-top:2px;"></div>
          </div>

          <div class="step-box">
            <span class="step-title" id="lblStep6">6. 發酵熟成</span>
            <div class="btn-row">
              <div class="opt-btn" onclick="setCfg('cure','fresh',this)" id="btnFresh"></div>
              <div class="opt-btn active" onclick="setCfg('cure','aged',this)" id="btnAged"></div>
              <div class="opt-btn" onclick="setCfg('cure','quantum',this)" id="btnQuantum"></div>
            </div>
          </div>
        </div>
      </div>

      <button class="launch-btn" onclick="startGame()" id="btnLaunch">🔥 點火出發！</button>
    </div>
  </div>

  <!-- 2. 遊戲指南彈窗 -->
  <div class="overlay-screen" id="guideModal" style="display:none; z-index:40;">
    <div class="modal-box">
      <h2 style="margin-top:0; color:var(--cyan);" id="guideTitle"></h2>
      <div class="guide-section" id="guideSec1"></div>
      <div class="guide-section" style="border-left-color:var(--green);" id="guideSec2"></div>
      <div class="guide-section" style="border-left-color:var(--yellow);" id="guideSec3"></div>
      <button class="launch-btn" onclick="toggleGuide(false)" id="guideCloseBtn"></button>
    </div>
  </div>

  <!-- 3. 結算畫面 -->
  <div class="overlay-screen" id="resultModal" style="display:none; z-index:45;">
    <div class="modal-box" style="text-align:center;">
      <h1 id="resTitle" style="font-size:1.8rem; margin-bottom:6px;"></h1>
      <p id="resDesc" style="color:#ccc; margin-bottom:14px; font-size:0.9rem;"></p>
      
      <div style="background:#190d30; padding:14px; border-radius:12px; border:1px solid var(--cyan); margin-bottom:14px;">
        <div style="font-size:2.3rem; font-weight:bold; color:var(--yellow);" id="resRank">RANK: SSS</div>
        <div style="font-size:1.3rem; color:var(--cyan); margin:6px 0;"><span id="lblFinalScore">Score: </span><span id="resScore">0</span></div>
        <div style="font-size:0.85rem; color:#ddd;" id="resDetail"></div>
        <div style="margin-top:8px; padding:6px; background:#0d061a; border-radius:8px; font-family:monospace; color:var(--green); font-size:0.8rem;" id="resSeed"></div>
      </div>

      <button class="launch-btn" onclick="quitToMenu()" id="btnRetry"></button>
    </div>
  </div>
</div>

<script>
// ==================== 1. 雙語字典系統 (精簡量化版) ====================
let curLang = 'zh';

const I18N = {
  zh: {
    mainTitle: "🧬 CyberTrip 4.0：宇宙穿越家",
    bestRecord: "🏆 最高：",
    guideBtn: "📖 指南",
    step1: "1. 麻草基因",
    sativa: "🌿 <b>Sativa</b><small>速度+30%</small>",
    indica: "🍂 <b>Indica</b><small>速度-25%</small>",
    hybrid: "⚡ <b>Hybrid</b><small>攻守均衡</small>",
    step2: "2. 音樂音源",
    modeRadio: "📻 <b>Global 電台</b><small>24/7 真實串流</small>",
    modeSynth: "🎹 <b>Web 合成器</b><small>內建程序電音</small>",
    subGenre: "↳ 選擇曲風頻道：",
    step3: "3. 遊戲難度",
    easy: "🌱 <b>簡單</b><small>3關・魔眼少</small>",
    normal: "🚀 <b>普通</b><small>5關・標準</small>",
    hard: "💀 <b>地獄</b><small>追蹤彈幕・3倍分</small>",
    step4: "4. 選擇角色",
    dog: "🐶 <b>邊牧</b><small>敏捷+30%｜震碎</small>",
    cat: "🐱 <b>折耳貓</b><small>體型-25%｜磁吸</small>",
    human: "🧑‍🚀 <b>潛行者</b><small>血量+30%｜滿血</small>",
    alien: "👽 <b>外星人</b><small>好球+15%｜點金</small>",
    step5: "5. THC 濃度：",
    step6: "6. 發酵熟成",

// ==================== 3. 非同步音訊與合成器保底引擎 ====================
let audioCtx, masterGain, delayNode, musicInterval;
let arpStep = 0;
let beatPulse = 0;

function initAudioSystem() {
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = isAudioMuted ? 0 : 0.65;

    delayNode = audioCtx.createDelay();
    delayNode.delayTime.value = 0.24;
    const fb = audioCtx.createGain();
    fb.gain.value = 0.32;
    delayNode.connect(fb);
    fb.connect(delayNode);
    delayNode.connect(masterGain);
    masterGain.connect(audioCtx.destination);
  } catch (e) {}

  if (cfg.audioMode === 'radio') {
    playGlobalRadioStream();
  } else {
    document.getElementById('radioStationLabel').innerText = `🎹 ${cfg.genre.toUpperCase()}`;
    startWebSynthLoop();
  }
}

function playGlobalRadioStream() {
  const radioEl = document.getElementById('globalRadioPlayer');
  const stations = GLOBAL_RADIOS[cfg.genre];
  const st = stations[currentStationIdx % stations.length];

  document.getElementById('radioStationLabel').innerText = `📻 ${st.name}`;
  if (musicInterval) clearInterval(musicInterval);
  if (radioWatchdog) clearTimeout(radioWatchdog);
  startVisualBeatClock();

  try {
    radioEl.pause();
    radioEl.src = st.url;
    radioEl.volume = isAudioMuted ? 0 : 0.85;
    radioEl.load();

    // Watchdog: 若 3.5 秒內電台流未成功播放，自動切備用台或啟動合成器，絕不讓遊戲無聲或卡頓
    let playedSuccess = false;
    radioEl.onplaying = () => { playedSuccess = true; if (radioWatchdog) clearTimeout(radioWatchdog); };
    
    radioWatchdog = setTimeout(() => {
      if (!playedSuccess && gs.active) {
        if (currentStationIdx + 1 < stations.length) {
          currentStationIdx++;
          playGlobalRadioStream();
        } else {
          fallbackToSynth();
        }
      }
    }, 3500);

    const playPromise = radioEl.play();
    if (playPromise !== undefined) {
      playPromise.catch(() => {
        if (currentStationIdx + 1 < stations.length) {
          currentStationIdx++;
          playGlobalRadioStream();
        } else {
          fallbackToSynth();
        }
      });
    }
  } catch (e) {
    fallbackToSynth();
  }
}

function fallbackToSynth() {
  if (radioWatchdog) clearTimeout(radioWatchdog);
  document.getElementById('radioStationLabel').innerText = `🎹 ${cfg.genre.toUpperCase()}`;
  if (musicInterval) clearInterval(musicInterval);
  startWebSynthLoop();
}

function switchRadioChannel() {
  if (!gs.active) return;
  if (cfg.audioMode === 'radio') {
    const stations = GLOBAL_RADIOS[cfg.genre];
    currentStationIdx = (currentStationIdx + 1) % stations.length;
    playGlobalRadioStream();
  } else {
    const genres = ['psytrance', 'cyberpunk', 'indie', 'techno'];
    cfg.genre = genres[(genres.indexOf(cfg.genre) + 1) % genres.length];
    document.getElementById('radioStationLabel').innerText = `🎹 ${cfg.genre.toUpperCase()}`;
  }
}

function toggleMuteAudio() {
  isAudioMuted = !isAudioMuted;
  const radioEl = document.getElementById('globalRadioPlayer');
  radioEl.volume = isAudioMuted ? 0 : 0.85;
  if (masterGain) masterGain.gain.value = isAudioMuted ? 0 : 0.65;
  document.getElementById('btnMuteAudio').innerText = isAudioMuted ? "🔇" : "🔊";
}

function startVisualBeatClock() {
  let bpm = cfg.genre === 'psytrance' ? 145 : (cfg.genre === 'cyberpunk' ? 118 : (cfg.genre === 'indie' ? 112 : 136));
  if (cfg.strain === 'indica') bpm *= 0.85;
  if (cfg.strain === 'sativa') bpm *= 1.05;
  const beatMs = (60 / bpm) * 1000;
  musicInterval = setInterval(() => {
    if (gs.active && !gs.paused) beatPulse = 1.0;
  }, beatMs);
}

function startWebSynthLoop() {
  let bpm = cfg.genre === 'psytrance' ? 145 : (cfg.genre === 'cyberpunk' ? 118 : (cfg.genre === 'indie' ? 112 : 136));
  if (cfg.strain === 'indica') bpm *= 0.84;
  if (cfg.strain === 'sativa') bpm *= 1.06;
  const stepSec = (60 / bpm) / 4;

  musicInterval = setInterval(() => {
    if (!gs.active || gs.paused || !audioCtx) return;
    const now = audioCtx.currentTime;
    const s = arpStep % 16;

    if (s % 4 === 0) {
      playKick(now, cfg.genre === 'cyberpunk' ? 115 : 155);
      beatPulse = 1.0;
    }
    if (cfg.genre === 'psytrance' && s % 4 !== 0) {
      playBass(now, gs.badTrip ? 51.9 : 55, 0.08, 'sawtooth', 800);
    } else if (cfg.genre === 'cyberpunk' && s % 2 === 0) {
      playBass(now, s < 8 ? 43.65 : 51.91, 0.16, 'sawtooth', 950);
    } else if (cfg.genre === 'techno' && (s === 2 || s === 6 || s === 10 || s === 14)) {
      playBass(now, 65.4, 0.12, 'sawtooth', 1600);
    } else if (cfg.genre === 'indie' && (s === 0 || s === 6 || s === 12)) {
      playBass(now, 65.4, 0.28, 'triangle', 550);
    }

    const scale = gs.badTrip ? [207.65, 220, 277.18, 311.13, 415.3] : [220, 261.63, 329.63, 392.00, 440, 523.25, 659.25];
    if (s % 2 === 0 || cfg.genre === 'psytrance') {
      const f = scale[(arpStep + (s % 3)) % scale.length] * (gs.stageIdx >= 3 ? 1.25 : 1);
      playStereoNote(now, f, 0.11, 'square', Math.sin(arpStep * 0.65) * 0.8);
    }
    arpStep++;
  }, stepSec * 1000);
}

function stopAllAudio() {
  if (musicInterval) { clearInterval(musicInterval); musicInterval = null; }
  if (radioWatchdog) { clearTimeout(radioWatchdog); radioWatchdog = null; }
  const radioEl = document.getElementById('globalRadioPlayer');
  try { radioEl.pause(); radioEl.removeAttribute('src'); } catch(e) {}
  if (audioCtx) {
    try { audioCtx.close(); } catch(e) {}
    audioCtx = null;
  }
}

function playKick(t, f) {
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(30, t + 0.13);
  g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
  o.connect(g); g.connect(masterGain); o.start(t); o.stop(t + 0.16);
}
function playBass(t, f, dur, type, cut) {
  const o = audioCtx.createOscillator(), fl = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  fl.type = 'lowpass'; fl.frequency.setValueAtTime(cut, t); fl.frequency.exponentialRampToValueAtTime(110, t + dur);
  g.gain.setValueAtTime(0.22, t); g.gain.exponentialRampToValueAtTime(0.01, t + dur);
  o.connect(fl); fl.connect(g); g.connect(masterGain); o.start(t); o.stop(t + dur + 0.02);
}
function playStereoNote(t, f, dur, type, panVal) {
  const o = audioCtx.createOscillator(), p = audioCtx.createStereoPanner(), g = audioCtx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); p.pan.setValueAtTime(panVal, t);
  g.gain.setValueAtTime(0.065, t); g.gain.exponentialRampToValueAtTime(0.004, t + dur);
  o.connect(p); p.connect(g); g.connect(masterGain); g.connect(delayNode); o.start(t); o.stop(t + dur + 0.02);
}
function playSFX(f1, f2, dur, type = 'sine') {
  if (!audioCtx || gs.paused || isAudioMuted) return;
  try {
    const t = audioCtx.currentTime;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0.24, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(masterGain); o.start(t); o.stop(t + dur);
  } catch(e) {}
}

// ==================== 4. 遊戲核心迴圈與 RCA 全相容操控 ====================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let width, height;
function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

const gs = {
  active: false, paused: false, score: 0, vibe: 100, maxVibe: 100, badTrip: false,
  combo: 1, maxCombo: 1, grazeCount: 0, skillCharge: 100,
  stageIdx: 0, stageProgress: 0, stageTarget: 7, invincibleUntil: 0, screenShake: 0,
  playerX: window.innerWidth / 2, targetX: window.innerWidth / 2,
  trail: [], particles: [], items: [], floatingTexts: [],
  bossX: window.innerWidth / 2, lasers: [],
  bossLaser: { state: 'idle', x: 0, x2: 0, timer: 0 }
};

// RCA 關鍵修復：同時支援滑鼠移動、點擊、手機單點與滑動 (Pointer + Touch 全事件綁定)
function handlePointerInput(clientX, clientY) {
  if (!gs.active || gs.paused) return;
  if (clientY < 55 || clientY > height - 48) return; // 避開頂部與底部按鈕區
  gs.targetX = clientX;
}
window.addEventListener('pointerdown', e => handlePointerInput(e.clientX, e.clientY));
window.addEventListener('pointermove', e => handlePointerInput(e.clientX, e.clientY));
window.addEventListener('touchstart', e => {
  if (e.touches.length > 0) handlePointerInput(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: true });
window.addEventListener('touchmove', e => {
  if (e.touches.length > 0) handlePointerInput(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: true });

window.addEventListener('keydown', e => {
  if (e.code === 'Space') {
    e.preventDefault();
    if (gs.active && !gs.paused) triggerSkill();
  }
  if (e.code === 'KeyP' && gs.active) togglePause();
});

function spawnParticles(x, y, color, count = 16) {
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * Math.PI * 2, spd = 2 + Math.random() * 6;
    gs.particles.push({ x, y, vx: Math.cos(ang)*spd, vy: Math.sin(ang)*spd, color, size: 3+Math.random()*3, alpha: 1.0 });
  }
}

function addFloatText(text, x, y, color = "#ffe600") {
  gs.floatingTexts.push({ text, x, y, color, alpha: 1.0, vy: -2.0 });
}

function flashScreen(color = "#fff") {
  const fl = document.getElementById('flashOverlay');
  fl.style.background = color; fl.style.opacity = '0.65';
  setTimeout(() => { fl.style.opacity = '0'; }, 80);
}

function togglePause() {
  if (!gs.active) return;
  gs.paused = !gs.paused;
  const t = I18N[curLang];
  document.getElementById('pauseBtn').innerText = gs.paused ? t.resume : t.pause;
  const radioEl = document.getElementById('globalRadioPlayer');
  if (cfg.audioMode === 'radio') {
    if (gs.paused) radioEl.pause();
    else radioEl.play().catch(()=>{});
  }
  if (!gs.paused) requestAnimationFrame(renderLoop);
}

function startGame() {
  document.getElementById('mainMenu').style.display = 'none';
  document.getElementById('resultModal').style.display = 'none';
  document.getElementById('hud').style.display = 'flex';
  document.getElementById('bottomBar').style.display = 'flex';

  // 顯示開局 3 秒直覺教學導覽卡
  const tut = document.getElementById('quickTutorial');
  tut.classList.add('show');
  setTimeout(() => { tut.classList.remove('show'); }, 3200);

  gs.active = true; gs.paused = false; gs.score = 0;
  // 角色量化屬性：潛行者血量上限 +30%
  gs.maxVibe = cfg.avatar === 'human' ? 130 : 100;
  gs.vibe = gs.maxVibe;
  gs.badTrip = false;
  gs.combo = cfg.cure === 'quantum' ? 4 : 1;
  gs.maxCombo = gs.combo; gs.grazeCount = 0; gs.skillCharge = 100;
  gs.stageIdx = 0; gs.items = []; gs.particles = []; gs.trail = [];
  gs.floatingTexts = []; gs.lasers = [];
  gs.playerX = width / 2; gs.targetX = width / 2;
  gs.bossLaser = { state: 'idle', x: width / 2, x2: width / 3, timer: 0 };

  canvas.classList.remove('wave-indica', 'bad-trip-fx');
  if (cfg.strain === 'indica') canvas.classList.add('wave-indica');

  initAudioSystem();
  setupStage(0);
  chargeSkill(0);
  requestAnimationFrame(renderLoop);
}

function setupStage(idx) {
  gs.stageIdx = idx; gs.stageProgress = 0;
  gs.invincibleUntil = performance.now() + 2200;
  gs.items = [];

  const meta = STAGE_META[idx];
  const diffMult = cfg.diff === 'easy' ? 0.65 : (cfg.diff === 'hard' ? 1.55 : 1);
  gs.stageTarget = meta.goalType === 'boss' ? 100 : Math.max(4, Math.round(meta.baseTarget * diffMult));

  flashScreen(meta.c1);
  canvas.classList.remove('spin-burst'); void canvas.offsetWidth; canvas.classList.add('spin-burst');
  playSFX(330, 920, 0.3, 'triangle');

  const t = I18N[curLang];
  addFloatText(`🚀 ${t.stages[idx].short}`, width / 2, height / 2 - 30, "#00f3ff");
  updateHUD();
}

function advanceStage(amount) {
  gs.stageProgress += amount;
  const maxStages = cfg.diff === 'easy' ? 3 : 5;
  if (gs.stageProgress >= gs.stageTarget) {
    if (gs.stageIdx + 1 >= maxStages) { endGame(true); return; }
    else setupStage(gs.stageIdx + 1);
  }
  updateHUD();
}

function chargeSkill(amt) {
  const mult = cfg.cure === 'fresh' ? 1.5 : 1.0;
  gs.skillCharge = Math.min(100, gs.skillCharge + amt * mult);
  const btn = document.getElementById('skillBtn');
  const t = I18N[curLang];
  if (gs.skillCharge >= 100) {
    btn.classList.add('ready');
    btn.innerText = t.skillReady;
  } else {
    btn.classList.remove('ready');
    btn.innerText = t.skillCharging(Math.floor(gs.skillCharge));
  }
}

function triggerSkill() {
  if (gs.skillCharge < 100 || !gs.active || gs.paused) return;
  gs.skillCharge = 0; chargeSkill(0);

  flashScreen("#00f3ff"); gs.screenShake = 14;
  playSFX(440, 1320, 0.3, 'sawtooth');
  addFloatText(I18N[curLang].skills[cfg.avatar], gs.playerX, height - 150, "#00ff66");

  if (cfg.avatar === 'dog') {
    gs.items.forEach(it => { if (it.type === 'bad') { spawnParticles(it.x, it.y, "#ff0055", 12); gs.score += 300; } });
    gs.items = gs.items.filter(it => it.type !== 'bad');
  } else if (cfg.avatar === 'cat') {
    gs.items.forEach(it => { if (it.type !== 'bad') { it.x = gs.playerX; it.y = height - 105; } });
  } else if (cfg.avatar === 'human') {
    gs.vibe = gs.maxVibe; gs.invincibleUntil = performance.now() + 3000;
  } else if (cfg.avatar === 'alien') {
    gs.items.forEach(it => { if (it.type === 'bad') { it.type = 'good'; spawnParticles(it.x, it.y, "#ffe600", 10); } });
  }
  updateHUD();
}

function updateHUD() {
  const t = I18N[curLang];
  const stText = t.stages[gs.stageIdx];
  document.getElementById('scoreVal').innerText = Math.floor(gs.score);
  document.getElementById('comboVal').innerText = `x${gs.combo}`;
  document.getElementById('vibeBar').style.width = `${Math.max(0, Math.min(100, (gs.vibe / gs.maxVibe) * 100))}%`;

  document.getElementById('stageTitle').innerText = stText.desc(gs.stageProgress, gs.stageTarget);
  document.getElementById('stageProgBar').style.width = `${Math.min(100, (gs.stageProgress / gs.stageTarget) * 100)}%`;

  const statusEl = document.getElementById('tripStatus');
  if (gs.vibe <= 0) { endGame(false); return; }
  else if (gs.vibe < 35) {
    gs.badTrip = true; canvas.classList.add('bad-trip-fx');
    statusEl.innerText = t.badTrip; statusEl.style.color = "#ff0055";
  } else {
    gs.badTrip = false; canvas.classList.remove('bad-trip-fx');
    statusEl.innerText = t.happyTrip; statusEl.style.color = "#00ff66";
  }
}

function endGame(victory) {
  gs.active = false;
  stopAllAudio();
  canvas.classList.remove('bad-trip-fx', 'wave-indica');

  const finalScore = Math.floor(gs.score);
  const t = I18N[curLang];
  if (finalScore > savedHighScore) {
    savedHighScore = finalScore;
    localStorage.setItem('cybertrip_best', savedHighScore);
    document.getElementById('highScoreBadge').innerText = `${t.bestRecord}${savedHighScore}`;
  }

  document.getElementById('resultModal').style.display = 'flex';
  const title = document.getElementById('resTitle');
  const desc = document.getElementById('resDesc');
  const rank = document.getElementById('resRank');

  if (victory) {
    title.innerText = t.winTitle; title.style.color = "#00ff66";
    desc.innerText = t.winDesc;
    rank.innerText = finalScore > 35000 ? "🏆 RANK: SSS" : (finalScore > 18000 ? "🌟 RANK: S" : "✨ RANK: A");
  } else {
    title.innerText = t.loseTitle; title.style.color = "#ff0055";
    desc.innerText = t.loseDesc;
    rank.innerText = "💀 RANK: F";
  }

  document.getElementById('resScore').innerText = finalScore;
  document.getElementById('resDetail').innerText = curLang === 'zh'
    ? `最高連擊：${gs.maxCombo}x ｜ 擦彈：${gs.grazeCount} 次 ｜ 難度：${cfg.diff.toUpperCase()}`
    : `Max Combo: ${gs.maxCombo}x | Grazes: ${gs.grazeCount} | Mode: ${cfg.diff.toUpperCase()}`;
  document.getElementById('resSeed').innerText = `🧬 SEED: CT4-${cfg.strain.toUpperCase()}-${cfg.thc}-${cfg.avatar.toUpperCase()}-${cfg.diff.toUpperCase()}`;
}

function quitToMenu() {
  gs.active = false;
  stopAllAudio();
  canvas.classList.remove('bad-trip-fx', 'wave-indica');
  document.getElementById('hud').style.display = 'none';
  document.getElementById('bottomBar').style.display = 'none';
  document.getElementById('resultModal').style.display = 'none';
  document.getElementById('mainMenu').style.display = 'flex';
}

// ==================== 5. 幾何背景與真實難易度差異引擎 ====================
function drawBackgroundAndBoss(t, meta) {
  ctx.fillStyle = cfg.strain === 'indica' ? "rgba(6, 2, 16, 0.24)" : "rgba(5, 1, 14, 0.38)";
  ctx.fillRect(0, 0, width, height);

  const cx = width / 2, cy = height / 2;
  beatPulse *= 0.88;
  const pulseScale = 1 + beatPulse * 0.16;

  ctx.save();
  if (gs.screenShake > 0) {
    ctx.translate((Math.random() - 0.5) * gs.screenShake, (Math.random() - 0.5) * gs.screenShake);
    gs.screenShake *= 0.85; if (gs.screenShake < 0.5) gs.screenShake = 0;
  }

  if (meta.bgType === 'cyber_grid') {
    const grad = ctx.createLinearGradient(0, cy - 160, 0, cy + 20);
    grad.addColorStop(0, "#ff007f"); grad.addColorStop(1, "#ffe600");
    ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(cx, cy - 50, 85 * pulseScale, 0, Math.PI * 2); ctx.fill();

    ctx.strokeStyle = meta.c2; ctx.lineWidth = 1.5 + beatPulse * 2;
    for (let i = -10; i <= 10; i++) {
      ctx.beginPath(); ctx.moveTo(cx + i * 25, cy); ctx.lineTo(cx + i * 185, height); ctx.stroke();
    }
    const off = (t * 0.16) % 40;
    for (let y = cy; y < height; y += 35) {
      ctx.beginPath(); ctx.moveTo(0, y + off); ctx.lineTo(width, y + off); ctx.stroke();
    }
  } else if (meta.bgType === 'sine_wave') {
    for (let w = 0; w < 5; w++) {
      ctx.beginPath(); ctx.strokeStyle = w % 2 === 0 ? meta.c1 : meta.c2;
      ctx.lineWidth = 2.5 + beatPulse * 2.5;
      for (let x = 0; x <= width; x += 24) {
        const y = cy + Math.sin(x * 0.01 + t * 0.004 + w) * (60 + w * 22) * pulseScale;
        if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
  } else if (meta.bgType === 'hex_tunnel') {
    ctx.beginPath(); ctx.arc(cx, cy, 32 * pulseScale, 0, Math.PI * 2);
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2.5; ctx.stroke();
    for (let r = 1; r <= 6; r++) {
      const rad = ((t * 0.25 + r * 95) % 600) * (1 + beatPulse * 0.05);
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(t * 0.0012 * (r % 2 === 0 ? 1 : -1));
      ctx.strokeStyle = r % 2 === 0 ? meta.c1 : meta.c2; ctx.lineWidth = 2.2;
      ctx.beginPath();
      for (let s = 0; s <= 6; s++) {
        const a = s * Math.PI / 3;
        if (s === 0) ctx.moveTo(Math.cos(a) * rad, Math.sin(a) * rad);
        else ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
      }
      ctx.stroke(); ctx.restore();
    }
  } else if (meta.bgType === 'mandala') {
    ctx.save(); ctx.translate(cx, cy);
    for (let i = 0; i < 10; i++) {
      ctx.rotate((Math.PI * 2) / 10);
      ctx.strokeStyle = i % 2 === 0 ? meta.c1 : meta.c2; ctx.lineWidth = 2 + beatPulse * 2;
      const p = (130 + Math.sin(t * 0.005) * 50) * pulseScale;
      ctx.beginPath(); ctx.ellipse(p * 0.6, 0, p, 42, t * 0.002, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.restore();
  } else if (meta.bgType === 'boss_void') {
    const bossSpd = cfg.diff === 'hard' ? 0.0038 : 0.0022;
    gs.bossX = cx + Math.sin(t * bossSpd) * (width * 0.32);
    const bossY = 115;

    // 根據難度調整 Boss 雷射頻率與預警時間 (地獄模式雙重雷射！)
    const idleLimit = cfg.diff === 'easy' ? 140 : (cfg.diff === 'hard' ? 65 : 100);
    const warnLimit = cfg.diff === 'easy' ? 85 : (cfg.diff === 'hard' ? 38 : 62);
    const laserHalfW = cfg.diff === 'easy' ? 20 : (cfg.diff === 'hard' ? 38 : 28);

    gs.bossLaser.timer++;
    if (gs.bossLaser.state === 'idle' && gs.bossLaser.timer > idleLimit) {
      gs.bossLaser.state = 'warn';
      gs.bossLaser.x = gs.playerX;
      gs.bossLaser.x2 = cfg.diff === 'hard' ? (width - gs.playerX) : -999; // 地獄難度雙重對稱雷射
      gs.bossLaser.timer = 0;
      playSFX(880, 440, 0.18, 'sine');
    } else if (gs.bossLaser.state === 'warn') {
      ctx.strokeStyle = `rgba(255, 0, 68, ${0.35 + Math.sin(t * 0.03) * 0.35})`;
      ctx.lineWidth = 5; ctx.setLineDash([12, 8]);
      [gs.bossLaser.x, gs.bossLaser.x2].forEach(lx => {
        if (lx > 0) {
          ctx.beginPath(); ctx.moveTo(lx, bossY + 35); ctx.lineTo(lx, height); ctx.stroke();
        }
      });
      ctx.setLineDash([]);
      ctx.fillStyle = "#ff0044"; ctx.font = "bold 15px sans-serif"; ctx.textAlign = "center";
      ctx.fillText(I18N[curLang].laserWarn, gs.bossLaser.x, height - 150);

      if (gs.bossLaser.timer > warnLimit) {
        gs.bossLaser.state = 'fire'; gs.bossLaser.timer = 0; gs.screenShake = 12;
        playSFX(180, 55, 0.3, 'sawtooth');
      }
    } else if (gs.bossLaser.state === 'fire') {
      ctx.fillStyle = "rgba(255, 0, 85, 0.85)"; ctx.shadowColor = "#ff0055"; ctx.shadowBlur = 25;
      [gs.bossLaser.x, gs.bossLaser.x2].forEach(lx => {
        if (lx > 0) {
          ctx.fillRect(lx - laserHalfW, bossY + 35, laserHalfW * 2, height);
          if (Math.abs(gs.playerX - lx) < (laserHalfW + 14) && t > gs.invincibleUntil) {
            const lDmg = cfg.diff === 'hard' ? 2.4 : 1.2;
            gs.vibe -= (cfg.cure === 'aged' ? lDmg * 0.55 : lDmg);
            gs.combo = 1; updateHUD();
          }
        }
      });
      if (gs.bossLaser.timer > 26) { gs.bossLaser.state = 'idle'; gs.bossLaser.timer = 0; }
    }

    ctx.shadowColor = "#ff0033"; ctx.shadowBlur = 30; ctx.fillStyle = "#220011"; ctx.strokeStyle = "#ff0055"; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.ellipse(gs.bossX, bossY, 95 * pulseScale, 46 * pulseScale, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#ff0033"; ctx.beginPath(); ctx.arc(gs.bossX, bossY, 26, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#000"; ctx.beginPath(); ctx.arc(gs.bossX, bossY, 11, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function renderLoop(t) {
  if (!gs.active || gs.paused) return;

  const meta = STAGE_META[gs.stageIdx];
  drawBackgroundAndBoss(t, meta);

  // 真實難易度物理參數差距
  const diffSpd = cfg.diff === 'easy' ? 0.68 : (cfg.diff === 'hard' ? 1.58 : 1.0);
  const strainSpd = cfg.strain === 'sativa' ? 1.25 : (cfg.strain === 'indica' ? 0.75 : 1.0);
  const fallSpeed = 4.6 * diffSpd * strainSpd * (0.85 + cfg.thc / 180);

  const spawnRate = cfg.diff === 'easy' ? 0.065 : (cfg.diff === 'hard' ? 0.135 : 0.085);
  if (Math.random() < spawnRate) {
    const r = Math.random();
    let type = 'good';
    // 難度與外星人幸運加成影響魔眼生成率
    let badProb = cfg.diff === 'easy' ? 0.15 : (cfg.diff === 'hard' ? 0.52 : 0.32);
    badProb += (cfg.thc - 50) * 0.002;
    if (cfg.avatar === 'alien') badProb -= 0.15; // 外星人量化天賦：好球率+15%

    if (meta.goalType === 'boss' && r > 0.60) type = 'star';
    else if (r < Math.max(0.08, badProb)) type = 'bad';
    else if (r > 0.91) type = 'cbd';

    const startX = Math.random() * (width - 100) + 50;
    gs.items.push({
      x: startX, baseX: startX,
      y: meta.goalType === 'boss' ? 130 : -35,
      vy: fallSpeed + Math.random() * 1.8,
      phase: Math.random() * Math.PI * 2,
      type, grazed: false
    });
  }

  // 角色敏捷度量化加成 (邊牧移動跟手速度 +30%)
  const sway = Math.sin(t * 0.005) * (cfg.thc * 0.16);
  let desiredX = gs.targetX + sway;
  if (meta.bgType === 'hex_tunnel') desiredX += (width / 2 - gs.playerX) * 0.025;

  let baseAgility = cfg.strain === 'indica' ? 0.09 : 0.18;
  if (cfg.avatar === 'dog') baseAgility *= 1.35;
  gs.playerX += (desiredX - gs.playerX) * Math.min(0.35, baseAgility);
  gs.playerX = Math.max(35, Math.min(width - 35, gs.playerX));
  const playerY = height - 92;

  const cloneOffsets = meta.bgType === 'mandala' ? [-105, 0, 105] : [0];

  // 主角光軌
  gs.trail.push({ x: gs.playerX, y: playerY });
  if (gs.trail.length > 12) gs.trail.shift();
  for (let i = 0; i < gs.trail.length; i++) {
    const tr = gs.trail[i], ratio = i / gs.trail.length;
    ctx.fillStyle = gs.badTrip ? `rgba(255, 0, 68, ${ratio * 0.4})` : `rgba(0, 243, 255, ${ratio * 0.4})`;
    ctx.beginPath(); ctx.arc(tr.x, tr.y + (12 - i) * 3.5, 20 * ratio, 0, Math.PI * 2); ctx.fill();
  }

  // 角色體型量化加成 (折耳貓受擊判定縮小 25%，更容易閃避魔眼)
  const badHitRadius = cfg.avatar === 'cat' ? 32 : 43;
  const goodHitRadius = 54; // 放寬好球拾取半徑，確保手感順暢

  for (let i = gs.items.length - 1; i >= 0; i--) {
    const it = gs.items[i];
    it.y += it.vy;

    if (meta.bgType === 'sine_wave') {
      it.x = it.baseX + Math.sin(it.y * 0.02 + it.phase) * 68;
    } else if (meta.bgType === 'hex_tunnel') {
      it.x += (width / 2 - it.x) * 0.0022;
    }

    // 地獄難度專屬：魔眼具備微幅自動追蹤玩家能力！
    if (cfg.diff === 'hard' && it.type === 'bad' && it.y < playerY - 60) {
      it.x += Math.sign(gs.playerX - it.x) * 1.35;
    }

    // 視覺防呆：為好壞掉落物畫上直覺的「綠圈 / 紅刺圈」光環！
    ctx.save();
    ctx.translate(it.x, it.y);
    if (it.type === 'bad') {
      // 紅色危險警示圈
      ctx.strokeStyle = "rgba(255, 0, 68, 0.85)";
      ctx.lineWidth = 2.5;
      ctx.setLineDash([5, 4]);
      ctx.beginPath(); ctx.arc(0, -4, 24, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
    } else {
      // 綠色/金色安全拾取圈
      ctx.strokeStyle = it.type === 'star' ? "rgba(255, 230, 0, 0.75)" : "rgba(0, 255, 102, 0.65)";
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, -4, 23, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.font = "32px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    const iconMap = { good: "✨", bad: "👁️", cbd: "🌿", star: "🌟" };
    ctx.fillText(iconMap[it.type], 0, 0);
    ctx.restore();

    let hitGood = false;
    for (const off of cloneOffsets) {
      if (Math.hypot(it.x - (gs.playerX + off), it.y - playerY) < goodHitRadius) { hitGood = true; break; }
    }
    const distMain = Math.hypot(it.x - gs.playerX, it.y - playerY);

    if ((it.type !== 'bad' && hitGood) || (it.type === 'bad' && distMain < badHitRadius)) {
      const thcMult = 1 + (cfg.thc / 45), diffMult = cfg.diff === 'hard' ? 3 : 1, badBonus = gs.badTrip ? 2.5 : 1.0;

      if (it.type === 'good') {
        const pts = Math.round(100 * gs.combo * thcMult * diffMult * badBonus);
        gs.score += pts; gs.combo = Math.min(16, gs.combo + 1); gs.maxCombo = Math.max(gs.maxCombo, gs.combo);
        gs.vibe = Math.min(gs.maxVibe, gs.vibe + 4); chargeSkill(15);
        spawnParticles(it.x, it.y, "#00f3ff", 14); playSFX(440 + gs.combo * 32, 880 + gs.combo * 40, 0.1, 'sine');
        addFloatText(`+${pts}`, it.x, it.y, "#00f3ff");
